SIMS.m_graph={
  title:'Quadratic & linear graph explorer',icon:'ray',eyebrow:'Maths Explore',
  sub:'Adjust a, b and c in y = ax² + bx + c (set a = 0 for a straight line) to inspect roots, vertex and y-intercept.',
  aspect:.66,maxH:270,anim:0,
  state:{a:1,b:-2,c:-3},
  ui:()=>SL('a','Coefficient a',-2,2,0.5)+SL('b','Coefficient b',-4,4,1)+SL('c','Constant c (y-int)',-5,5,1),
  fmt:{a:v=>Number(v).toFixed(1),b:v=>v,c:v=>v},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,sc=Math.min(W,H)/14;
    const X=x=>cx+x*sc,Y=y=>cy-y*sc;
    c.strokeStyle=K.grid;c.lineWidth=1;
    for(let i=-6;i<=6;i++){c.beginPath();c.moveTo(X(i),8);c.lineTo(X(i),H-8);c.stroke();c.beginPath();c.moveTo(8,Y(i));c.lineTo(W-8,Y(i));c.stroke();}
    c.strokeStyle=K.ink2;c.lineWidth=1.6;
    c.beginPath();c.moveTo(8,cy);c.lineTo(W-8,cy);c.moveTo(cx,8);c.lineTo(cx,H-8);c.stroke();
    c.strokeStyle=K.purple;c.lineWidth=2.8;c.beginPath();
    let started=false;
    for(let x=-7;x<=7;x+=0.1){
      const y=st.a*x*x+st.b*x+st.c;
      if(Math.abs(y)<9){
        if(!started){c.moveTo(X(x),Y(y));started=true;} else c.lineTo(X(x),Y(y));
      }else started=false;
    }
    c.stroke();
    // Highlight y-intercept
    c.fillStyle=K.orange;c.beginPath();c.arc(X(0),Y(st.c),5,0,Math.PI*2);c.fill();
    // Highlight vertex if quadratic
    if(Math.abs(st.a)>0.05){
      const vx=-st.b/(2*st.a),vy=st.a*vx*vx+st.b*vx+st.c;
      if(Math.abs(vy)<7){c.fillStyle=K.green;c.beginPath();c.arc(X(vx),Y(vy),5.5,0,Math.PI*2);c.fill();}
    }
    txt(c,`y = ${st.a}x² ${st.b>=0?'+':''}${st.b}x ${st.c>=0?'+':''}${st.c}`,12,16,{col:K.purple,s:11.5,w:800});
  },
  read(s){
    const {a,b,c}=s.st;
    if(Math.abs(a)<0.05) return cells([['Line type','Straight line (m = '+b+')'],['y-intercept',`(0, ${c})`]]);
    const vx=(-b/(2*a)).toFixed(2),vy=(a*vx*vx+b*vx+c).toFixed(2);
    const disc=b*b-4*a*c;
    const roots=disc<0?'No real roots':disc===0?`${(-b/(2*a)).toFixed(2)}`:`${((-b+Math.sqrt(disc))/(2*a)).toFixed(2)}, ${((-b-Math.sqrt(disc))/(2*a)).toFixed(2)}`;
    return cells([['Turning point',`(${vx}, ${vy})`],['Real roots',roots]]);
  }
};

SIMS.m_trig={
  title:'Trigonometry & SOHCAHTOA explorer',icon:'ray',eyebrow:'Maths Explore',
  sub:'Vary angle θ and hypotenuse H to see Opposite, Adjacent, sin/cos/tan and area update live.',
  aspect:.60,maxH:250,anim:0,
  state:{ang:38,hyp:10},
  ui:()=>SL('ang','Angle θ',15,75,1)+SL('hyp','Hypotenuse H',5,20,1),
  fmt:{ang:v=>v+'°',hyp:v=>v+' cm'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const rad=st.ang*Math.PI/180,scale=Math.min(W*0.58,H*0.72)/20;
    const adjPx=st.hyp*Math.cos(rad)*scale*1.15,oppPx=st.hyp*Math.sin(rad)*scale*1.15;
    const x0=W*0.22,y0=H*0.80,x1=x0+adjPx,y1=y0-oppPx;
    c.fillStyle=K.lav;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y0);c.lineTo(x1,y1);c.closePath();c.fill();
    c.strokeStyle=K.purple;c.lineWidth=2.6;c.stroke();
    // Right angle square
    c.strokeStyle=K.ink2;c.lineWidth=1.5;c.strokeRect(x1-10,y0-10,10,10);
    txt(c,`θ=${st.ang}°`,x0+18,y0-10,{col:K.orange,s:11,w:800});
    txt(c,`H = ${st.hyp}`,(x0+x1)/2-14,(y0+y1)/2-10,{col:K.purple,s:11,w:800,al:'right'});
    txt(c,`Opp = ${(st.hyp*Math.sin(rad)).toFixed(1)}`,x1+8,(y0+y1)/2,{col:K.green,s:11,w:800});
    txt(c,`Adj = ${(st.hyp*Math.cos(rad)).toFixed(1)}`,(x0+x1)/2,y0+14,{col:K.ink,s:11,w:800,al:'center'});
  },
  read(s){
    const rad=s.st.ang*Math.PI/180,opp=s.st.hyp*Math.sin(rad),adj=s.st.hyp*Math.cos(rad);
    return cells([['sin θ / cos θ',`${Math.sin(rad).toFixed(3)} / ${Math.cos(rad).toFixed(3)}`],['Area ½ × Adj × Opp',(0.5*opp*adj).toFixed(1)+' cm²']]);
  }
};

SIMS.m_trans={
  title:'2D transformations & vectors explorer',icon:'spark',eyebrow:'Maths Explore',
  sub:'Select a transformation to see object triangle A (purple) map to image A′ (orange) on the grid.',
  aspect:.66,maxH:265,anim:0,
  state:{op:'rot90'},
  ui:()=>CH('op',[['trans','Translate (−3, 2)'],['refyx','Reflect y = x'],['rot90','Rotate 90° ACW'],['enl','Enlarge k = 2']]),
  fmt:{},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),op=s.st.op;
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,sc=Math.min(W,H)/12;
    const X=x=>cx+x*sc,Y=y=>cy-y*sc;
    c.strokeStyle=K.grid;c.lineWidth=1;
    for(let i=-5;i<=5;i++){c.beginPath();c.moveTo(X(i),8);c.lineTo(X(i),H-8);c.stroke();c.beginPath();c.moveTo(8,Y(i));c.lineTo(W-8,Y(i));c.stroke();}
    c.strokeStyle=K.ink2;c.lineWidth=1.5;c.beginPath();c.moveTo(8,cy);c.lineTo(W-8,cy);c.moveTo(cx,8);c.lineTo(cx,H-8);c.stroke();
    if(op==='refyx'){c.strokeStyle=K.muted;c.setLineDash([4,4]);c.beginPath();c.moveTo(X(-5),Y(-5));c.lineTo(X(5),Y(5));c.stroke();c.setLineDash([]);}
    const obj=[[1,1],[3,1],[1,2]];
    const mapPt=([x,y])=>op==='trans'?[x-3,y+2]:op==='refyx'?[y,x]:op==='rot90'?[-y,x]:[x*2,y*2];
    const drawTri=(pts,fill,stroke,lbl)=>{
      c.fillStyle=fill;c.strokeStyle=stroke;c.lineWidth=2.2;
      c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y)));c.closePath();c.fill();c.stroke();
      txt(c,lbl,X(pts[0][0])+6,Y(pts[0][1])-10,{col:stroke,s:11,w:800});
    };
    drawTri(obj,K.lav,K.purple,'A');
    drawTri(obj.map(mapPt),K.peach,K.orange,'A′');
  },
  read(s){
    const desc={trans:'Translation by (−3, 2)',refyx:'Reflection in line y = x',rot90:'Rotation 90° anticlockwise about (0,0)',enl:'Enlargement, scale factor 2, centre (0,0)'}[s.st.op];
    return cells([['Single transformation',desc],['Congruent?',s.st.op==='enl'?'Similar (area ×4)':'Yes (congruent)']]);
  }
};

SIMS.m_stat={
  title:'Cumulative frequency & quartiles explorer',icon:'wave',eyebrow:'Maths Explore',
  sub:'Adjust class spread to see the cumulative frequency S-curve, median Q₂ and IQR = Q₃ − Q₁.',
  aspect:.60,maxH:245,anim:0,
  state:{med:55,iqr:22},
  ui:()=>SL('med','Median score Q₂',35,70,5)+SL('iqr','Interquartile range (IQR)',10,36,2),
  fmt:{med:v=>v+' marks',iqr:v=>v+' marks'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const pad={l:38,r:14,t:16,b:28},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
    const X=x=>pad.l+(x/100)*pw,Y=y=>pad.t+ph-(y/100)*ph;
    c.strokeStyle=K.grid;c.lineWidth=1;
    [25,50,75,100].forEach(y=>{c.beginPath();c.moveTo(pad.l,Y(y));c.lineTo(pad.l+pw,Y(y));c.stroke();txt(c,y+'%',pad.l-6,Y(y),{col:K.muted,al:'right',s:9.5});});
    c.strokeStyle=K.ink2;c.lineWidth=1.5;c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,pad.t+ph);c.lineTo(pad.l+pw,pad.t+ph);c.stroke();
    // Logistic S-curve matching med and iqr
    const k=2.197/Math.max(4,st.iqr);
    c.strokeStyle=K.purple;c.lineWidth=2.8;c.beginPath();
    for(let x=0;x<=100;x+=2){
      const y=100/(1+Math.exp(-k*(x-st.med)));
      if(x===0) c.moveTo(X(x),Y(y)); else c.lineTo(X(x),Y(y));
    }
    c.stroke();
    // Q1, Q2, Q3 guide lines
    const q1=Math.max(5,st.med-st.iqr/2),q3=Math.min(95,st.med+st.iqr/2);
    [[q1,25,K.orange,'Q₁'],[st.med,50,K.green,'Q₂'],[q3,75,K.orange,'Q₃']].forEach(([x,y,colr,lb])=>{
      c.strokeStyle=colr;c.setLineDash([4,3]);c.lineWidth=1.4;
      c.beginPath();c.moveTo(pad.l,Y(y));c.lineTo(X(x),Y(y));c.lineTo(X(x),pad.t+ph);c.stroke();c.setLineDash([]);
      txt(c,lb,X(x),pad.t+ph+13,{col:colr,al:'center',s:10,w:800});
    });
  },
  read(s){
    const q1=Math.round(s.st.med-s.st.iqr/2),q3=Math.round(s.st.med+s.st.iqr/2);
    return cells([['Q₁ · Median · Q₃',`${q1} · ${s.st.med} · ${q3}`],['IQR = Q₃ − Q₁',`${s.st.iqr} marks`]]);
  }
};

/* ===== SIMS ENGINE LIFECYCLE ===== */
const Sims={
  list:[],raf:null,last:0,
  unmount(){
    if(typeof SoundAudio!=='undefined') SoundAudio.stop();
    if(this.raf){cancelAnimationFrame(this.raf);this.raf=null;}
    this.list.forEach(it=>{if(it.ro) it.ro.disconnect();});
    this.list=[];
  },
  mount(){
    this.unmount();
    document.querySelectorAll('[data-sim]').forEach(el=>{
      const id=el.dataset.sim,def=SIMS[id];
      if(!def) return;
      if(!SST[id]) SST[id]=JSON.parse(JSON.stringify(def.state||{}));
      const cv=el.querySelector('canvas');
      if(!cv) return;
      const item={id,def,el,cv,c:cv.getContext('2d'),st:SST[id],W:320,H:180,t:0,dirty:true};
      const resize=()=>{
        const r=cv.parentElement.getBoundingClientRect();
        const w=Math.max(240,Math.round(r.width));
        const h=Math.min(def.maxH||260,Math.round(w*(def.aspect||.6)));
        const dpr=Math.min(2.5,window.devicePixelRatio||1);
        cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
        cv.style.height=h+'px';
        item.c.setTransform(dpr,0,0,dpr,0,0);
        item.W=w;item.H=h;item.dirty=true;
        drawOne(item);
      };
      item.ro=new ResizeObserver(resize);
      item.ro.observe(cv.parentElement);
      // Wire sliders
      el.querySelectorAll('[data-sl]').forEach(inp=>{
        const k=inp.dataset.sl;
        inp.value=item.st[k];
        const lbl=el.querySelector(`[data-slv="${k}"]`);
        if(lbl) lbl.textContent=def.fmt&&def.fmt[k]?def.fmt[k](item.st[k]):item.st[k];
        inp.addEventListener('input',()=>{
          item.st[k]=Number(inp.value);
          if(lbl) lbl.textContent=def.fmt&&def.fmt[k]?def.fmt[k](item.st[k]):item.st[k];
          if(def.change) def.change(item,k);
          item.dirty=true;updateRead(item);drawOne(item);
        });
      });
      // Wire chips
      el.querySelectorAll('[data-ch]').forEach(btn=>{
        const k=btn.dataset.ch,v=btn.dataset.val;
        if(String(item.st[k])===String(v)) btn.classList.add('on');
        btn.addEventListener('click',()=>{
          item.st[k]=isNaN(Number(v))?v:Number(v);
          el.querySelectorAll(`[data-ch="${k}"]`).forEach(b=>b.classList.toggle('on',b===btn));
          item.dirty=true;updateRead(item);drawOne(item);
        });
      });
      // Wire action buttons
      el.querySelectorAll('[data-act]').forEach(btn=>{
        btn.addEventListener('click',()=>{if(def.act) def.act(item,btn.dataset.act);});
      });
      updateRead(item);
      resize();
      this.list.push(item);
    });
    if(this.list.some(i=>i.def.anim) && !reducedMotion()){
      this.last=performance.now();
      const tick=now=>{
        const dt=Math.min(0.05,(now-this.last)/1000);
        this.last=now;
        this.list.forEach(it=>{
          if(it.def.anim){it.t+=dt;drawOne(it);}
        });
        this.raf=requestAnimationFrame(tick);
      };
      this.raf=requestAnimationFrame(tick);
    }
  }
};
function drawOne(it){try{it.def.frame(it);}catch(e){}}
function updateRead(it){
  const box=it.el.querySelector('[data-read]');
  if(box && it.def.read) box.innerHTML=it.def.read(it);
}

/* ===== HERO AMBIENT CANVAS ===== */
function drawHero(){
  const cv=document.getElementById('hero-cv');
  if(!cv) return;
  const r=cv.parentElement.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(200,r.width)*dpr;cv.height=Math.max(120,r.height)*dpr;
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1.6;
  for(let k=0;k<5;k++){
    c.beginPath();
    for(let x=0;x<=r.width;x+=6){
      const y=r.height*(0.2+k*0.17)+Math.sin(x*0.025+k*1.1)*12;
      if(x===0) c.moveTo(x,y); else c.lineTo(x,y);
    }
    c.stroke();
  }
}

    return `<article class="card note" id="note-${n.id}">
    <div class="row wrap" style="gap:8px">

      <div class="urdu-hd">Roman Urdu help</div>
      <div class="urdu-rom">${n.ur}</div>
      <div class="urdu-rtl" lang="ur">${n.urdu}</div>
    </div>`:''}
    ${n.cmp?`<div class="cmp-wrap">
      <div class="cmp-hd">${n.cmp.title}</div>
      <table class="cmp-tbl">
        <thead><tr>${n.cmp.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${n.cmp.rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<td><b>${c}</b></td>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`:''}
    <div class="eq-list">
      ${n.eqs.map(([f,tag])=>`<div class="eq"><div class="math">${f}</div><span class="eq-tag">${tag}</span></div>`).join('')}
    </div>
    ${(n.sims|| (n.sim?[n.sim]:[])).map(id=>simCard(id)).join('')}
    <div class="we">
      <div class="between">
        <div class="we-hd">Worked example (step-by-step)</div>
        <span class="sub num">${shown}/${totalSteps} shown</span>
      </div>
      <div class="we-q">${n.we.q}</div>
      ${shown>0?`<ol class="we-steps">${n.we.s.slice(0,shown).map(st=>`<li>${st}</li>`).join('')}</ol>`:''}
      ${shown>=totalSteps?`<div class="we-ans num">${n.we.a}</div>`:''}
      <div class="we-ctrl">
        ${shown<totalSteps?`<button type="button" class="btn btn-o btn-s" data-westep="${n.id}:next">${shown===0?'Reveal step 1':shown===n.we.s.length?'Reveal final answer':'Reveal next step'}</button>`:''}
        ${shown<totalSteps?`<button type="button" class="btn btn-g btn-s" data-westep="${n.id}:all">Show all</button>`:`<button type="button" class="btn btn-g btn-s" data-westep="${n.id}:reset">Hide steps</button>`}
      </div>
    </div>
    <div class="tip ${n.tip[2]||''}">
      <div class="tip-hd">${n.tip[0]}</div>
      <div class="tip-txt">${n.tip[1]}</div>
    </div>
  </article>`;
  }).join('');
  return top+body;
}

      ${focus.map(o=>`<button type="button" class="opt" data-focus="${o[0]}">
        <span class="pill p-lav num">${o[0]}</span>
        <span style="flex:1;font-size:13px">${esc(o[1])}</span>
      </button>`).join('')}
    </div>`:`<p class="sub" style="margin:8px 0 0">Every syllabus objective in Topic ${dispCode} is marked confident!</p>`}
  </div>`;
}

function wireHScroll(el,btnL,btnR){
  if(!el) return;
  const sync=()=>{
    if(!btnL||!btnR) return;
    btnL.classList.toggle('hide',el.scrollLeft<=4);
    btnR.classList.toggle('hide',el.scrollLeft+el.clientWidth>=el.scrollWidth-4);
  };
  el.addEventListener('scroll',sync,{passive:true});
  el.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
      el.scrollLeft+=e.deltaY;
      e.preventDefault();
    }
  },{passive:false});
  let down=false,startX=0,startL=0,moved=false;
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;
    down=true;moved=false;startX=e.clientX;startL=el.scrollLeft;
  });
  window.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-startX;
    if(Math.abs(dx)>4){moved=true;el.scrollLeft=startL-dx;}
  });
  window.addEventListener('pointerup',()=>{down=false;});
  el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  if(btnL) btnL.addEventListener('click',()=>{el.scrollBy({left:-160,behavior:'smooth'});});
  if(btnR) btnR.addEventListener('click',()=>{el.scrollBy({left:160,behavior:'smooth'});});
  requestAnimationFrame(()=>{
    const active=el.querySelector('button.on');
    if(active){
      const target=active.offsetLeft-(el.clientWidth-active.offsetWidth)/2;
      el.scrollLeft=Math.max(0,target);
    }
    sync();
  });
}

function wireTopic(){
  wireHScroll(document.getElementById('sec-strip'),document.getElementById('strip-l'),document.getElementById('strip-r'));
  document.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>go('topic',b.dataset.sec)));
  document.querySelectorAll('[data-lt]').forEach(b=>b.addEventListener('click',()=>jumpLink(b.dataset.lt,b.dataset.lr)));
  document.querySelectorAll('[data-conf]').forEach(b=>b.addEventListener('click',()=>{
    const code=b.dataset.conf,st=TS();
    st.conf[code]=((st.conf[code]||0)+1)%3;
    save();render();
  }));
  // MCQ
  document.querySelectorAll('[data-mdot]').forEach(b=>b.addEventListener('click',()=>{TS().mcqAt=Number(b.dataset.mdot);save();render();}));
  document.querySelectorAll('[data-mopt]').forEach(b=>b.addEventListener('click',()=>{
    const st=TS();st.mcq[st.mcqAt]=Number(b.dataset.mopt);save();render();
  }));
  const mp=document.getElementById('mcq-prev'),mn=document.getElementById('mcq-next'),mr=document.getElementById('mcq-reset');
  if(mp) mp.addEventListener('click',()=>{const st=TS();if(st.mcqAt>0){st.mcqAt--;save();render();}});
  if(mn) mn.addEventListener('click',()=>{const st=TS();if(st.mcqAt<curP().mcq.length-1){st.mcqAt++;save();render();}});
  if(mr) mr.addEventListener('click',()=>{const st=TS();st.mcq={};st.mcqAt=0;save();render();toast('MCQ progress reset');});
  // Structured
  document.querySelectorAll('[data-sqta]').forEach(ta=>ta.addEventListener('input',()=>{
    const k=ta.dataset.sqta,st=TS();if(!st.sq[k]) st.sq[k]={txt:'',rev:false,ticks:{}};
    st.sq[k].txt=ta.value;save();
  }));
  document.querySelectorAll('[data-sqrev]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.sqrev,st=TS();if(!st.sq[k]) st.sq[k]={txt:'',rev:false,ticks:{}};
    st.sq[k].rev=!st.sq[k].rev;save();render();
  }));
  document.querySelectorAll('[data-mstick]').forEach(b=>b.addEventListener('click',()=>{
    const [k,mi]=b.dataset.mstick.split(':'),st=TS();
    if(!st.sq[k]) st.sq[k]={txt:'',rev:true,ticks:{}};
    if(!st.sq[k].ticks) st.sq[k].ticks={};
    st.sq[k].ticks[mi]=!st.sq[k].ticks[mi];
    save();render();
  }));
  // Lab
  document.querySelectorAll('[data-lcell]').forEach(inp=>inp.addEventListener('change',()=>{
    const [idx,field]=inp.dataset.lcell.split(':');
    const v=parseFloat(inp.value);
    if(!isNaN(v)){TS().lab.rows[Number(idx)][field]=v;save();render();}
  }));
  document.querySelectorAll('[data-ldel]').forEach(b=>b.addEventListener('click',()=>{
    TS().lab.rows.splice(Number(b.dataset.ldel),1);save();render();
  }));
  const lf=document.getElementById('lab-fill'),lc=document.getElementById('lab-clear'),ld=document.getElementById('lab-done');
  if(lf) lf.addEventListener('click',()=>{
    const T=curP(),lb=TS().lab;
    if(T.customLab){
      lb.rows=[15,25,35,45,55,65].map(iDeg=>({
        i:iDeg,
        r1:roundHalf(trueR(iDeg)+seededNoise(lb.seed,iDeg,1)),
        r2:roundHalf(trueR(iDeg)+seededNoise(lb.seed,iDeg,2))
      }));
    }else{
      const cfg=T.lab,xs=[];
      for(let v=cfg.min;v<=cfg.max+1e-9;v+=cfg.step) xs.push(Number(v.toFixed(2)));
      const snap=v=>Math.round(v/cfg.divErr)*cfg.divErr;
      lb.rows=xs.slice(0,6).map(xVal=>({
        i:xVal,
        r1:Number(Math.max(0.01,snap(cfg.fnY(xVal)+seededNoise(lb.seed,xVal,1)*cfg.noiseAmp)).toFixed(2)),
        r2:Number(Math.max(0.01,snap(cfg.fnY(xVal)+seededNoise(lb.seed,xVal,2)*cfg.noiseAmp)).toFixed(2))
      }));
    }
    save();render();toast('Filled 6 sample readings');
  });
  if(lc) lc.addEventListener('click',()=>{TS().lab.rows=[];TS().lab.done=false;save();render();toast('Lab table cleared');});
  if(ld) ld.addEventListener('click',()=>{TS().lab.done=!TS().lab.done;save();render();toast(TS().lab.done?'Virtual practical marked complete!':'Marked incomplete');});
  // Flashcards
  const fcCard=document.getElementById('fc-card'),fcFlip=document.getElementById('fc-flip'),fcPrev=document.getElementById('fc-prev'),fcNext=document.getElementById('fc-next');
  const toggleFlip=()=>{const st=TS();st.fcFlip=!st.fcFlip;save();render();};
  if(fcCard) fcCard.addEventListener('click',toggleFlip);
  if(fcFlip) fcFlip.addEventListener('click',toggleFlip);
  if(fcPrev) fcPrev.addEventListener('click',()=>{const st=TS(),n=curP().flashcards.length;st.fcAt=((st.fcAt||0)-1+n)%n;st.fcFlip=false;save();render();});
  if(fcNext) fcNext.addEventListener('click',()=>{const st=TS(),n=curP().flashcards.length;st.fcAt=((st.fcAt||0)+1)%n;st.fcFlip=false;save();render();});
  // Worked-example step reveal
  document.querySelectorAll('[data-westep]').forEach(b=>b.addEventListener('click',()=>{
    const [nid,act]=b.dataset.westep.split(':'),st=TS();
    const note=curP().notes.find(x=>x.id===nid);
    if(!note) return;
    const max=note.we.s.length+1;
    if(act==='next') st.weStep[nid]=Math.min(max,(st.weStep[nid]||0)+1);
    else if(act==='all') st.weStep[nid]=max;
    else st.weStep[nid]=0;
    save();render();
  }));
  // Progress focus
  document.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>go('topic','objectives')));
}

function render(){
  if(S.scr==='subjects') S.scr='home';
  renderTopbar();
  const main=document.getElementById('main');
  if(S.scr==='home'){
    main.innerHTML=renderAllSubjectsHome();
    wireAllSubjectsHome();
  }else if(S.scr==='subject'){
    main.innerHTML=renderHome();
    wireHome();
  }else{
    let body='';
    if(S.sec==='objectives') body=renderObjectives();
    else if(S.sec==='learn') body=renderLearn();
    else if(S.sec==='commands') body=renderCommands();
    else if(S.sec==='practice') body=renderPractice();
    else if(S.sec==='lab') body=renderLab();
    else if(S.sec==='life') body=renderLife();
    else body=renderProgress();
    main.innerHTML=renderTopicFrame(body);
    wireTopic();
  }
  renderTabbar();
  Sims.mount();
  drawHero();
}

window.addEventListener('scroll',()=>{
  const tb=document.getElementById('topbar');
  if(tb) tb.classList.toggle('scrolled',window.scrollY>6);
},{passive:true});

render();
</script>
