<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studymate · Cambridge O Level (Physics 5054, Maths 4024 & 7 Subject Outlines)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=STIX+Two+Text:ital,wght@0,500;1,500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F9; --card:#FFFFFF; --ink:#1D1E2C; --ink2:#56576B; --muted:#8E8FA3; --line:#ECECF3; --line2:#DCDBEA;
  --purple:#6F5EF5; --purple2:#8D7BFF; --orange:#FF7A1F; --orange2:#FFA24A; --yellow:#FFC53D;
  --green:#22B07D; --red:#F0525A; --pink:#FFE9EE; --lav:#EFEDFF; --peach:#FFEEDF; --mint:#E2F7EE; --butter:#FFF5D6;
  --stage:#FBFAFF; --stage2:#F2F0FC; --grid:#E7E5F3;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --math:"STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --urdu:"Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13131B; --card:#1D1D29; --ink:#ECECF6; --ink2:#B5B5CA; --muted:#8C8CA3; --line:#2A2A3A; --line2:#383849;
    --purple:#9A8BFF; --purple2:#B4A8FF; --lav:#2A2747; --peach:#3A2A1E; --mint:#17352B; --butter:#36301A; --pink:#3A2027;
    --stage:#171722; --stage2:#1C1C2A; --grid:#2A2A3B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13131B; --card:#1D1D29; --ink:#ECECF6; --ink2:#B5B5CA; --muted:#8C8CA3; --line:#2A2A3A; --line2:#383849;
  --purple:#9A8BFF; --purple2:#B4A8FF; --lav:#2A2747; --peach:#3A2A1E; --mint:#17352B; --butter:#36301A; --pink:#3A2027;
  --stage:#171722; --stage2:#1C1C2A; --grid:#2A2A3B; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}

/* Wordmark */
.wm{display:inline-flex;align-items:baseline;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-size:24px}
.wm-b{background:linear-gradient(100deg,var(--purple2) 0%,var(--purple) 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm-dot{display:inline-block;width:.22em;height:.22em;border-radius:50%;background:linear-gradient(135deg,#FFC53D,#FF7A1F);margin-left:.06em}
.lvl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--ink);color:var(--bg);margin-left:8px;transform:translateY(-3px);display:inline-block}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .18s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-title{font-size:16px;font-weight:800;letter-spacing:-.02em;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:transform .12s,background .15s}
.iconbtn:active{transform:scale(.95)}
.urdubtn{height:36px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px;flex-shrink:0;transition:all .15s}
.urdubtn.on{background:var(--purple);border-color:var(--purple);color:#fff}

/* Main */
main{padding:8px calc(18px + env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}

/* Typography */
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.12}
h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.25px;line-height:1.25}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.ttl{font-size:15px;font-weight:700;line-height:1.3}
.sub{font-size:12.5px;color:var(--muted);line-height:1.4}
.muted{color:var(--ink2)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.tight{padding:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}

/* Pills & Chips */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.p-lav{background:var(--lav);color:var(--purple)}
.p-peach{background:var(--peach);color:var(--orange)}
.p-mint{background:var(--mint);color:var(--green)}
.p-butter{background:var(--butter);color:#B07800}
:root[data-theme="dark"] .p-butter{color:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-butter{color:var(--yellow)}}
.p-pink{background:var(--pink);color:var(--red)}
.p-ink{background:var(--ink);color:var(--bg)}
.p-ghost{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.ichip{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}

/* Segmented control */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:9px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2);transition:all .15s}
.seg button.on{background:var(--ink);color:var(--bg)}

/* Stat tiles */
.tiles{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 138px;height:150px;border-radius:24px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;position:relative;overflow:hidden;transition:transform .14s}
.tile:active{transform:scale(.97)}
.tile.t-org{background:linear-gradient(145deg,#FF9B3D,#FF6B1A)}
.tile.t-pur{background:linear-gradient(145deg,#8D7BFF,#614EE8)}
.tile.t-yel{background:linear-gradient(145deg,#FFD666,#FFB82E);color:#1D1E2C}
.tile.t-grn{background:linear-gradient(145deg,#34C78F,#199A6A)}
.tile-lbl{font-size:11.5px;font-weight:700;opacity:.9}
.tile-val{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tile-sub{font-size:11.5px;font-weight:600;opacity:.88;line-height:1.25}

/* Continue & Syllabus rows */
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;transition:transform .12s}
.cont:active{transform:scale(.985)}
.syl-list{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.syl-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:16px;width:100%;text-align:left;transition:background .14s}
.syl-row:hover{background:var(--bg)}
.syl-row.dim{opacity:.58}
.syl-num{width:48px;height:38px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink2);flex-shrink:0;white-space:nowrap;text-align:center;line-height:1;padding:0 4px}
.syl-num.rng{font-size:10px;letter-spacing:-.03em}
.syl-row.live .syl-num{background:var(--purple);border-color:var(--purple);color:#fff}
.ring{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:1;font-size:10px;font-weight:800;color:var(--ink2)}

/* Hero */
.hero{border-radius:var(--r-lg);padding:20px 18px 18px;color:#fff;background:linear-gradient(135deg,#7D6BFF 0%,#5A46E5 100%);position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}
.hero-code{font-size:11.5px;font-weight:700;opacity:.9;letter-spacing:.02em}
.hero h1{color:#fff;font-size:28px}
.hero-pills{display:flex;flex-wrap:wrap;gap:6px}
.hero-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff}
.hero-bar-wrap{margin-top:4px}
.hero-bar-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;opacity:.95;margin-bottom:6px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--purple);transition:width .3s}
.hero .bar{background:rgba(255,255,255,.22)}
.hero .bar-fill{background:#fff}

/* Sticky section strip */
.strip-wrap{position:sticky;top:64px;z-index:25;margin:0 -18px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 18px 10px;flex:1;min-width:0;-webkit-overflow-scrolling:touch;touch-action:pan-x;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;cursor:grab}
.strip:active{cursor:grabbing}
.strip::-webkit-scrollbar{height:4px}
.strip::-webkit-scrollbar-track{background:transparent}
.strip::-webkit-scrollbar-thumb{background:var(--line2);border-radius:999px}
.strip button{flex-shrink:0;padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink2);transition:all .15s;user-select:none}
.strip button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.strip-arr{position:absolute;top:50%;transform:translateY(-54%);z-index:2;width:28px;height:28px;border-radius:999px;background:var(--card);border:1px solid var(--line2);color:var(--ink);display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:0 2px 8px rgba(29,30,44,.12);transition:opacity .15s}
.strip-arr.l{left:6px}
.strip-arr.r{right:6px}
.strip-arr.hide{opacity:0;pointer-events:none}

/* Objectives */
.obj-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.obj-item:first-child{border-top:none;padding-top:4px}
.obj-code{font-size:12px;font-weight:800;color:var(--purple);min-width:44px;padding-top:2px}
.obj-body{flex:1;min-width:0}
.obj-txt{font-size:13.5px;line-height:1.45;color:var(--ink)}
.obj-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line2);color:var(--ink2);transition:all .14s}
.lchip:hover{border-color:var(--purple);color:var(--purple)}
.confbtn{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line2);background:var(--bg);display:grid;place-items:center;flex-shrink:0;margin-top:2px;transition:all .15s}
.confbtn.c1{background:var(--butter);border-color:#E5B122;color:#9A6900}
.confbtn.c2{background:var(--mint);border-color:var(--green);color:var(--green)}

/* Learn notes */
.note{display:flex;flex-direction:column;gap:14px}
.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink2);font-size:14px}
.pts strong{color:var(--ink)}
.urdu-box{background:var(--butter);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.urdu-hd{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#9A6900}
:root[data-theme="dark"] .urdu-hd{color:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .urdu-hd{color:var(--yellow)}}
.urdu-rom{font-size:13.5px;line-height:1.5;color:var(--ink)}
.urdu-rtl{font-family:var(--urdu);direction:rtl;text-align:right;font-size:16px;line-height:2;color:var(--ink);border-top:1px solid rgba(154,105,0,.18);padding-top:6px}
.eq-list{display:flex;flex-direction:column;gap:8px}
.eq{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:10px 14px;flex-wrap:wrap}
.math{font-family:var(--math);font-size:18px;color:var(--ink);display:inline-flex;align-items:center;gap:4px;line-height:1.2}
.math i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.9em}
.fr-n{border-bottom:1.2px solid currentColor;padding:0 4px 1px;line-height:1.15}
.fr-d{padding:1px 4px 0;line-height:1.15}
.eq-tag{font-size:11px;font-weight:700;color:var(--muted)}
.we{border:1.5px dashed var(--line2);border-radius:16px;padding:14px;background:var(--stage);display:flex;flex-direction:column;gap:8px}
.we-hd{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--orange)}
.we-q{font-size:13.5px;font-weight:600;color:var(--ink)}
.we-steps{margin:0;padding-left:18px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.we-ans{font-size:13.5px;font-weight:800;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;align-self:flex-start}
.tip{border-radius:14px;padding:12px 14px;background:var(--mint);display:flex;flex-direction:column;gap:4px}
.tip.warn{background:var(--pink)}
.tip-hd{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green)}
.tip.warn .tip-hd{color:var(--red)}
.tip-txt{font-size:13px;color:var(--ink);line-height:1.45}

/* Sim card */
.sim-card{background:var(--stage);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sim-stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);touch-action:none}
.sim-stage canvas{display:block;width:100%}
.sim-hint{position:absolute;bottom:8px;right:8px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--ink);color:var(--bg);opacity:.85;pointer-events:none;transition:opacity .25s}
.sim-hint.gone{opacity:0}
.sim-ui{display:flex;flex-direction:column;gap:10px}
.sl-row{display:flex;flex-direction:column;gap:4px}
.sl-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink2)}
.sl-top b{color:var(--ink)}
input[type="range"]{width:100%;accent-color:var(--purple);height:6px;cursor:pointer}
.ch-row{display:flex;flex-wrap:wrap;gap:6px}
.ch-btn{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line2);color:var(--ink2);transition:all .14s}
.ch-btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cell-k{font-size:11px;font-weight:700;color:var(--muted)}
.cell-v{font-size:13.5px;font-weight:800;color:var(--ink);margin-top:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:700;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--purple);color:#fff}
.btn-o{background:var(--orange);color:#fff}
.btn-g{background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.btn-s{padding:8px 12px;font-size:12.5px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* MCQ */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dot{width:26px;height:26px;border-radius:999px;font-size:11px;font-weight:800;background:var(--bg);border:1.5px solid var(--line2);color:var(--ink2);display:grid;place-items:center}
.dot.cur{border-color:var(--purple);color:var(--purple);box-shadow:0 0 0 2px var(--lav)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.bad{background:var(--red);border-color:var(--red);color:#fff}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--stage);font-size:13.5px;transition:all .14s}
.opt:hover:not(:disabled){border-color:var(--purple)}
.opt-k{width:24px;height:24px;border-radius:8px;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.opt.ok{background:var(--mint);border-color:var(--green)}
.opt.ok .opt-k{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:var(--pink);border-color:var(--red)}
.opt.bad .opt-k{background:var(--red);border-color:var(--red);color:#fff}
.exp-box{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--lav);font-size:13px;line-height:1.45;color:var(--ink)}

/* Structured */
.sq-part{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sq-ta{width:100%;min-height:76px;border-radius:14px;border:1px solid var(--line2);background:var(--stage);padding:10px 12px;font-size:13.5px;resize:vertical}
.sq-ta:focus{outline:2px solid var(--purple);border-color:transparent}
.ms-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ms-row{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--stage);font-size:13px;transition:all .14s}
.ms-row.on{background:var(--mint);border-color:var(--green)}
.ms-code{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--lav);color:var(--purple);flex-shrink:0}
.ms-row.on .ms-code{background:var(--green);color:#fff}

/* Lab table */
.tbl-wrap{overflow-x:auto;margin:10px -4px 0;padding:0 4px}
table.labtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.labtbl th{text-align:left;padding:8px 6px;font-size:11px;font-weight:800;color:var(--muted);border-bottom:1.5px solid var(--line2);white-space:nowrap}
.labtbl td{padding:6px 5px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.labtbl input{width:52px;padding:4px 6px;border-radius:8px;border:1px solid var(--line2);background:var(--stage);font-size:12.5px;text-align:center}
.delbtn{width:26px;height:26px;border-radius:8px;background:var(--pink);color:var(--red);font-weight:800;font-size:13px;display:grid;place-items:center}

/* Real life */
.life-card{padding:0;overflow:hidden}
.life-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--stage2)}
.life-svg{width:100%;aspect-ratio:16/9;overflow:hidden;display:block}
.life-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.exam-link{background:var(--lav);border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.45;color:var(--ink)}
.exam-link b{color:var(--purple)}

/* Progress */
.grade-box{width:72px;height:72px;border-radius:20px;background:linear-gradient(145deg,#FF9B3D,#FF6B1A);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800;letter-spacing:-.04em;flex-shrink:0}
.gscale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.gband{padding:7px 4px;border-radius:10px;text-align:center;font-size:12px;font-weight:800;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.gband.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pbar-row{display:flex;flex-direction:column;gap:6px}

/* Bottom section nav */
.sec-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}

/* Bottom tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:40;background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -4px 20px rgba(29,30,44,.05)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.tab.on{color:var(--purple)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 36px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* Value-add blocks */
.prereq{background:var(--lav);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px}
.prereq ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.cmap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.cmap-core{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;padding:10px 16px;border-radius:16px;font-size:13px;font-weight:800;text-align:center;box-shadow:0 4px 12px rgba(111,94,245,.22)}
.cmap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.cmap-node{background:var(--stage);border:1.5px solid var(--line2);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .14s,transform .12s}
.cmap-node:hover{border-color:var(--purple)}
.cmap-node:active{transform:scale(.97)}
.cmap-node b{font-size:12.5px;color:var(--ink)}
.cmap-node span{font-size:11px;color:var(--muted);line-height:1.3}
.cmp-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--stage)}
.cmp-hd{background:var(--stage2);padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--purple)}
table.cmp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp-tbl th{text-align:left;padding:7px 10px;font-size:11.5px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--line2);background:var(--card)}
.cmp-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;line-height:1.35}
.cmp-tbl tr:last-child td{border-bottom:none}
.fc-card{min-height:126px;border-radius:18px;border:1.5px solid var(--line2);background:var(--stage);padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;cursor:pointer;transition:border-color .15s,background .15s}
.fc-card.flipped{background:var(--lav);border-color:var(--purple)}
.fc-q{font-size:15px;font-weight:800;color:var(--ink)}
.fc-a{font-size:13.5px;color:var(--ink);line-height:1.45}
.we-ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.ann-grid{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ann-box{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:6px}
.ann-bad{background:var(--pink);border:1px solid rgba(240,82,90,.25)}
.ann-ok{background:var(--mint);border:1px solid rgba(34,176,125,.28)}
.ann-hl{background:var(--card);padding:1px 6px;border-radius:6px;font-weight:800;color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ===== SCORING & ANALYTICS (ALL 25 DEDICATED TOPIC PAGES) ===== */
const objStats=(code=S.code)=>{
  const pg=PAGES[code]||MATH_PAGES[code]||curP(),items=pg.obj.flatMap(g=>g.items),st=TS(code);
  let pts=0,conf=0,mid=0;
  items.forEach(o=>{
    const c=st.conf[o[0]]||0;
    pts+=c;
    if(c===2) conf++; else if(c===1) mid++;
  });
  return {pts,max:items.length*2,score:items.length?pts/(items.length*2):0,conf,mid,total:items.length};
};
const mcqStats=(code=S.code)=>{
  const pg=PAGES[code]||MATH_PAGES[code]||curP(),list=pg.mcq,st=TS(code);
  let right=0,ans=0;
  list.forEach((q,i)=>{if(st.mcq[i]!==undefined){ans++; if(st.mcq[i]===q.a) right++;}});
  return {right,ans,total:list.length,score:list.length?right/list.length:0};
};
const sqStats=(code=S.code)=>{
  const pg=PAGES[code]||MATH_PAGES[code]||curP(),list=pg.sq,st=TS(code);
  let got=0,total=0,attempted=0;
  list.forEach(q=>q.parts.forEach(p=>{
    total+=p.m;
    const pst=st.sq[q.id+p.k];
    if(pst&&pst.rev){
      attempted+=p.m;
      p.ms.forEach((_,idx)=>{if(pst.ticks&&pst.ticks[idx]) got++;});
    }
  }));
  return {got,total,attempted,score:total?got/total:0};
};
const labScore=(code=S.code)=>{const lb=TS(code).lab; return lb.done?1:Math.min(0.5,(lb.rows.length/6)*0.5);};
const topicMastery=(code=S.code)=>{
  const pg=PAGES[code]||MATH_PAGES[code]||curP();
  const m=pg.isMaths
    ?(0.25*objStats(code).score + 0.25*mcqStats(code).score + 0.40*sqStats(code).score + 0.10*(TS(code).lab.done?1:0))
    :(0.25*objStats(code).score + 0.25*mcqStats(code).score + 0.35*sqStats(code).score + 0.15*labScore(code));
  return Math.round(m*100);
};
const activeCodes=()=>S.subj==='4024'?MATH_CODES:ALL_CODES;
const overallAvg=()=>{
  const list=activeCodes();
  const vals=list.map(c=>topicMastery(c));
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
};
const bandOf=pct=>{
  for(const [g,min] of GRADES) if(pct>=min) return g;
  return 'U';
};

const SST={};

const SL=(k,lbl,min,max,step)=>`<div class="sl-row"><div class="sl-top"><span>${lbl}</span><b class="num" data-slv="${k}"></b></div><input type="range" data-sl="${k}" min="${min}" max="${max}" step="${step}"></div>`;
const CH=(k,opts)=>`<div class="ch-row">${opts.map(([v,l])=>`<button type="button" class="ch-btn" data-ch="${k}" data-val="${v}">${l}</button>`).join('')}</div>`;
const cells=arr=>`<div class="cells">${arr.map(([k,v])=>`<div class="cell"><div class="cell-k">${k}</div><div class="cell-v num">${v}</div></div>`).join('')}</div>`;
function arrow(c,x1,y1,x2,y2,color,w=2.2){
  const a=Math.atan2(y2-y1,x2-x1),hl=8;
  c.save();c.strokeStyle=color;c.fillStyle=color;c.lineWidth=w;c.lineCap='round';
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-hl*Math.cos(a-.45),y2-hl*Math.sin(a-.45));c.lineTo(x2-hl*Math.cos(a+.45),y2-hl*Math.sin(a+.45));c.closePath();c.fill();
  c.restore();
}
function txt(c,t,x,y,o={}){
  c.save();c.font=`${o.w||700} ${o.s||11.5}px "Plus Jakarta Sans",sans-serif`;
  c.fillStyle=o.col||col().ink;c.textAlign=o.al||'left';c.textBaseline=o.bl||'middle';
  c.fillText(t,x,y);c.restore();
}

/* --- SIM 1: Transverse & Longitudinal Wave --- */
SIMS.wave={
  title:'Transverse & longitudinal wave',icon:'wave',eyebrow:'Interactive animation',
  sub:'Adjust frequency and wavelength to see how wave speed v = fλ and particle motion respond.',
  aspect:.58,maxH:245,anim:1,
  state:{mode:'trans',f:2.0,lam:2.0,amp:34},
  ui:()=>CH('mode',[['trans','Transverse'],['long','Longitudinal']])+
    SL('f','Frequency f',0.5,4.0,0.5)+SL('lam','Wavelength λ',1.0,4.0,0.2)+SL('amp','Amplitude A',14,48,2),
  fmt:{f:v=>Number(v).toFixed(1)+' Hz',lam:v=>Number(v).toFixed(1)+' m',amp:v=>v+' px'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);
    c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const mid=H*0.52,pxPerM=W/6.5,lamPx=st.lam*pxPerM;
    // Grid
    c.strokeStyle=K.grid;c.lineWidth=1;
    for(let x=0;x<W;x+=pxPerM*0.5){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
    c.beginPath();c.moveTo(0,mid);c.lineTo(W,mid);c.stroke();
    const omega=2*Math.PI*st.f*0.42;
    const k=2*Math.PI/lamPx;
    if(st.mode==='trans'){
      // Wave curve
      c.beginPath();
      for(let x=14;x<=W-14;x+=2){
        const y=mid-st.amp*Math.sin(k*x - omega*s.t);
        if(x===14) c.moveTo(x,y); else c.lineTo(x,y);
      }
      c.strokeStyle=K.purple;c.lineWidth=3;c.stroke();
      // Highlight one oscillating particle
      const px=W*0.32,py=mid-st.amp*Math.sin(k*px - omega*s.t);
      c.strokeStyle=K.orange;c.setLineDash([4,4]);c.lineWidth=1.5;
      c.beginPath();c.moveTo(px,mid-st.amp);c.lineTo(px,mid+st.amp);c.stroke();c.setLineDash([]);
      c.fillStyle=K.orange;c.beginPath();c.arc(px,py,6.5,0,Math.PI*2);c.fill();
      txt(c,'Particle vibrates ↕',px+10,mid-st.amp-10,{col:K.orange,s:11});
      // Wavelength bracket
      const bx=W*0.52;
      c.strokeStyle=K.green;c.lineWidth=2;
      c.beginPath();c.moveTo(bx,22);c.lineTo(Math.min(W-14,bx+lamPx),22);c.stroke();
      txt(c,'λ',bx+Math.min(W-14-bx,lamPx)/2,12,{col:K.green,al:'center',s:12,w:800});
      arrow(c,18,H-18,92,H-18,K.ink2,1.8);
      txt(c,'Energy transfer →',98,H-18,{col:K.ink2,s:11});
    }else{
      // Longitudinal dots
      const cols=34,rows=5;
      for(let i=0;i<cols;i++){
        const x0=18+(i/(cols-1))*(W-36);
        const disp=(st.amp*0.36)*Math.sin(k*x0 - omega*s.t);
        const x=x0+disp;
        const comp=Math.cos(k*x0 - omega*s.t);
        c.fillStyle=comp>0.35?K.purple:comp<-0.35?K.muted:K.ink2;
        for(let r=0;r<rows;r++){
          const y=mid-36+r*18;
          c.beginPath();c.arc(x,y,i===11&&r===2?5.5:3.1,0,Math.PI*2);
          if(i===11&&r===2) c.fillStyle=K.orange;
          c.fill();
          if(i===11&&r===2) c.fillStyle=comp>0.35?K.purple:K.ink2;
        }
      }
      txt(c,'Compression (high P)',18,22,{col:K.purple,s:11});
      txt(c,'Rarefaction (low P)',W-18,22,{col:K.muted,s:11,al:'right'});
      txt(c,'Particle vibrates ↔',W*0.32,H-36,{col:K.orange,s:11});
      arrow(c,18,H-16,92,H-16,K.ink2,1.8);
      txt(c,'Energy transfer →',98,H-16,{col:K.ink2,s:11});
    }
  },
  read(s){
    const v=s.st.f*s.st.lam,T=1/s.st.f;
    return cells([['Wave speed v = fλ',v.toFixed(2)+' m/s'],['Period T = 1/f',T.toFixed(2)+' s']]);
  }
};

/* --- SIM 2: Refraction & Total Internal Reflection --- */
SIMS.refract={
  title:'Refraction & total internal reflection',icon:'ray',eyebrow:'Interactive animation',
  sub:'Switch direction to Glass → Air and increase angle i past the critical angle c to trigger TIR.',
  aspect:.62,maxH:260,anim:0,
  state:{i:38,n:1.50,dir:'into'},
  ui:()=>CH('dir',[['into','Air → Medium'],['out','Medium → Air']])+
    CH('n',[['1.33','Water (1.33)'],['1.50','Glass (1.50)'],['2.42','Diamond (2.42)']])+
    SL('i','Angle of incidence i',5,80,1),
  fmt:{i:v=>v+'°'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    const n=Number(st.n),iRad=st.i*Math.PI/180;
    const midY=H*0.5,cx=W*0.5,len=Math.min(W,H)*0.44;
    c.clearRect(0,0,W,H);
    // Top & bottom media
    const topDense=st.dir==='out';
    c.fillStyle=topDense?K.lav:K.stage;c.fillRect(0,0,W,midY);
    c.fillStyle=topDense?K.stage:K.lav;c.fillRect(0,midY,W,H-midY);
    c.strokeStyle=K.line2;c.lineWidth=1.5;c.beginPath();c.moveTo(0,midY);c.lineTo(W,midY);c.stroke();
    // Normal
    c.strokeStyle=K.muted;c.setLineDash([5,5]);c.lineWidth=1.5;
    c.beginPath();c.moveTo(cx,14);c.lineTo(cx,H-14);c.stroke();c.setLineDash([]);
    txt(c,'Normal',cx+6,22,{col:K.muted,s:10.5});
    txt(c,topDense?`Medium (n=${n.toFixed(2)})`:'Air (n=1.00)',12,20,{col:K.ink2,s:11});
    txt(c,topDense?'Air (n=1.00)':`Medium (n=${n.toFixed(2)})`,12,H-18,{col:K.ink2,s:11});
    // Incident ray (from top-left)
    const ix=cx-len*Math.sin(iRad),iy=midY-len*Math.cos(iRad);
    arrow(c,ix,iy,cx,midY,K.orange,2.8);
    txt(c,`i = ${st.i}°`,cx-38,midY-34,{col:K.orange,s:11.5,al:'right'});
    // Refracted or TIR
    const sinR=topDense?(Math.sin(iRad)*n):(Math.sin(iRad)/n);
    if(sinR>1){
      // Total internal reflection
      const rx=cx+len*Math.sin(iRad),ry=midY-len*Math.cos(iRad);
      arrow(c,cx,midY,rx,ry,K.red,2.8);
      txt(c,'Total Internal Reflection!',cx+10,midY+24,{col:K.red,s:12,w:800});
    }else{
      const rRad=Math.asin(sinR);
      const rx=cx+len*Math.sin(rRad),ry=midY+len*Math.cos(rRad);
      arrow(c,cx,midY,rx,ry,K.purple,2.8);
      txt(c,`r = ${(rRad*180/Math.PI).toFixed(1)}°`,cx+14,midY+36,{col:K.purple,s:11.5});
      // Faint partial reflection when denser -> air
      if(topDense){
        c.save();c.globalAlpha=.35;
        arrow(c,cx,midY,cx+len*0.85*Math.sin(iRad),midY-len*0.85*Math.cos(iRad),K.orange,1.8);
        c.restore();
      }
    }
  },
  read(s){
    const n=Number(s.st.n),iRad=s.st.i*Math.PI/180,cDeg=(Math.asin(1/n)*180/Math.PI).toFixed(1);
    const sinR=s.st.dir==='out'?Math.sin(iRad)*n:Math.sin(iRad)/n;
    const status=sinR>1?'TIR (r = none)':`${(Math.asin(sinR)*180/Math.PI).toFixed(1)}°`;
    return cells([['Refracted angle r',status],['Critical angle c',cDeg+'°']]);
  }
};


/* --- SIM 2b: Thin Converging & Diverging Lens Ray Diagram --- */
SIMS.lens={
  title:'Thin lens ray-diagram sandbox',icon:'ray',eyebrow:'Interactive animation',
  sub:'Slide object distance u across 2F and F to see principal rays and image nature update live.',
  aspect:.62,maxH:260,anim:0,
  state:{type:'conv',u:2.4},
  ui:()=>CH('type',[['conv','Converging (convex)'],['div','Diverging (concave)']])+
    SL('u','Object distance u (in focal lengths f)',0.5,3.2,0.1),
  fmt:{u:v=>Number(v).toFixed(1)+' f'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);
    c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const cx=W*0.5,cy=H*0.54,fPx=Math.min(W*0.135,58),hObj=Math.min(H*0.24,46);
    // Principal axis
    c.strokeStyle=K.line2;c.lineWidth=1.4;
    c.beginPath();c.moveTo(10,cy);c.lineTo(W-10,cy);c.stroke();
    // F and 2F ticks
    [-2,-1,1,2].forEach(m=>{
      const x=cx+m*fPx;
      c.strokeStyle=K.muted;c.lineWidth=1.4;
      c.beginPath();c.moveTo(x,cy-5);c.lineTo(x,cy+5);c.stroke();
      txt(c,Math.abs(m)===2?'2F':'F',x,cy+15,{col:K.muted,al:'center',s:10.5,w:700});
    });
    // Lens symbol
    c.strokeStyle=K.purple;c.lineWidth=2.6;
    c.beginPath();c.moveTo(cx,cy-hObj*1.45);c.lineTo(cx,cy+hObj*1.45);c.stroke();
    if(st.type==='conv'){
      // Outward arrows
      c.beginPath();
      c.moveTo(cx-6,cy-hObj*1.45+7);c.lineTo(cx,cy-hObj*1.45);c.lineTo(cx+6,cy-hObj*1.45+7);
      c.moveTo(cx-6,cy+hObj*1.45-7);c.lineTo(cx,cy+hObj*1.45);c.lineTo(cx+6,cy+hObj*1.45-7);
      c.stroke();
    }else{
      // Inward arrows
      c.beginPath();
      c.moveTo(cx-6,cy-hObj*1.45-2);c.lineTo(cx,cy-hObj*1.45+6);c.lineTo(cx+6,cy-hObj*1.45-2);
      c.moveTo(cx-6,cy+hObj*1.45+2);c.lineTo(cx,cy+hObj*1.45-6);c.lineTo(cx+6,cy+hObj*1.45+2);
      c.stroke();
    }
    const u=Number(st.u);
    const ox=cx-u*fPx,oy=cy-hObj;
    // Draw Object arrow
    arrow(c,ox,cy,ox,oy,K.ink,2.6);
    txt(c,'Object',ox,oy-11,{col:K.ink,al:'center',s:10.5,w:800});

    const fSign=st.type==='conv'?1:-1;
    const invV=(1/fSign)-(1/u);
    if(Math.abs(invV)<0.04){
      // Object at F -> parallel rays, image at infinity
      arrow(c,ox,oy,cx,oy,K.orange,2);
      arrow(c,cx,oy,W-14,oy+(W-14-cx)*(hObj/fPx),K.orange,2);
      arrow(c,ox,oy,W-14,oy+(W-14-ox)*(hObj/(u*fPx)),K.purple,2);
      txt(c,'Rays emerge parallel (image at infinity)',W-12,18,{col:K.orange,al:'right',s:11,w:800});
      return;
    }
    const v=1/invV; // in units of f
    const m=-v/u;
    const ix=cx+v*fPx,iy=cy-m*hObj;
    const isReal=v>0;

    // Ray 1: parallel to axis -> through F (or appears from F)
    c.strokeStyle=K.orange;c.lineWidth=1.9;
    c.beginPath();c.moveTo(ox,oy);c.lineTo(cx,oy);c.stroke();
    if(st.type==='conv'){
      if(isReal){
        arrow(c,cx,oy,ix,iy,K.orange,1.9);
      }else{
        // Real refracted ray going forward through right F
        const tx=W-12,ty=oy+(tx-cx)*(hObj/fPx);
        arrow(c,cx,oy,tx,ty,K.orange,1.9);
        // Dashed back-extension to virtual image
        c.save();c.strokeStyle=K.orange;c.setLineDash([4,4]);c.lineWidth=1.6;
        c.beginPath();c.moveTo(cx,oy);c.lineTo(ix,iy);c.stroke();c.restore();
      }
    }else{
      // Diverging: ray bends away as if from left F
      const tx=W-12,ty=oy-(tx-cx)*(hObj/fPx);
      arrow(c,cx,oy,tx,ty,K.orange,1.9);
      c.save();c.strokeStyle=K.orange;c.setLineDash([4,4]);c.lineWidth=1.6;
      c.beginPath();c.moveTo(cx,oy);c.lineTo(cx-fPx,cy);c.stroke();c.restore();
    }

    // Ray 2: straight through optical centre
    if(isReal){
      arrow(c,ox,oy,ix,iy,K.purple,1.9);
    }else{
      const tx=W-12,ty=oy+(tx-ox)*(hObj/(u*fPx));
      arrow(c,ox,oy,tx,ty,K.purple,1.9);
      c.save();c.strokeStyle=K.purple;c.setLineDash([4,4]);c.lineWidth=1.6;
      c.beginPath();c.moveTo(ox,oy);c.lineTo(ix,iy);c.stroke();c.restore();
    }

    // Draw Image arrow (clamped visually if very large, label clearly)
    if(ix>8 && ix<W-8){
      c.save();
      if(!isReal) c.setLineDash([4,3]);

/* --- SIM 4: Sound & Oscilloscope (CRO) with Live Web Audio --- */
const SoundAudio={
  ctx:null,osc:null,gain:null,on:false,
  start(freq,amp){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      if(!this.ctx) this.ctx=new AC();
      if(this.ctx.state==='suspended') this.ctx.resume();
      this.stop();
      this.osc=this.ctx.createOscillator();
      this.gain=this.ctx.createGain();
      this.osc.type='sine';
      this.osc.frequency.setValueAtTime(Math.min(freq,16000),this.ctx.currentTime);
      const vol=freq>20000?0:(amp/100)*0.16;
      this.gain.gain.setValueAtTime(0.0001,this.ctx.currentTime);
      this.gain.gain.exponentialRampToValueAtTime(Math.max(0.0001,vol),this.ctx.currentTime+0.04);
      this.osc.connect(this.gain);
      this.gain.connect(this.ctx.destination);
      this.osc.start();
      this.on=true;
      return true;
    }catch(e){return false;}
  },
  update(freq,amp){
    if(!this.on||!this.ctx||!this.osc||!this.gain) return;
    const now=this.ctx.currentTime;
    this.osc.frequency.setTargetAtTime(Math.min(freq,16000),now,0.03);
    const vol=freq>20000?0.0001:Math.max(0.0001,(amp/100)*0.16);
    this.gain.gain.setTargetAtTime(vol,now,0.03);
  },
  stop(){
    try{
      if(this.osc){this.osc.stop();this.osc.disconnect();this.osc=null;}
      if(this.gain){this.gain.disconnect();this.gain=null;}
    }catch(e){}
    this.on=false;
  }
};

/* --- SIM 6: Virtual Practical Apparatus (Glass block refraction) --- */
function seededNoise(seed,i,rep){
  const x=Math.sin(seed*12.9898 + i*78.233 + rep*37.719)*43758.5453;
  const u=x-Math.floor(x);
  return (u-0.5)*1.4; // +/- 0.7 deg realistic protractor noise
}
function trueR(iDeg){
  return Math.asin(Math.sin(iDeg*Math.PI/180)/LAB.nTrue)*180/Math.PI;
}
function roundHalf(v){return Math.round(v*2)/2;}

/* --- SIM 7: Virtual Practical Graph (sin i vs sin r) --- */
function labAnalysis(){
  const pts=TS().lab.rows.filter(r=>r.r1!=null).map(r=>{
    const rMean=r.r2!=null?(r.r1+r.r2)/2:r.r1;
    const dr=r.r2!=null?Math.max(0.5,Math.abs(r.r1-r.r2)/2):0.5;
    const x=Math.sin(rMean*Math.PI/180);
    const y=Math.sin(r.i*Math.PI/180);
    const dx=Math.abs(Math.sin((rMean+dr)*Math.PI/180)-Math.sin((rMean-dr)*Math.PI/180))/2;
    return {i:r.i,rMean,dr,x,y,dx};
  }).sort((a,b)=>a.x-b.x);
  if(pts.length<2) return {pts,ready:false};
  const n=pts.length;
  const sx=pts.reduce((a,p)=>a+p.x,0),sy=pts.reduce((a,p)=>a+p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0),sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const denom=n*sxx-sx*sx;
  const m=denom?((n*sxy-sx*sy)/denom):1.5;
  const b=(sy-m*sx)/n;
  // Worst acceptable line through error-bar extremes of first & last points
  const p0=pts[0],p1=pts[pts.length-1];
  const mWorst=(p1.y-p0.y)/Math.max(0.01,(p1.x-p1.dx)-(p0.x+p0.dx));
  const bWorst=p0.y-mWorst*(p0.x+p0.dx);
  const dm=Math.abs(mWorst-m);
  const pct=m?(dm/m)*100:0;
  return {pts,ready:pts.length>=5,m,b,mWorst,bWorst,dm,pct};
}

/* --- T1 SIM A: Speed-Time Graph & Kinematics --- */
SIMS.motion={
  title:'Speed–time graph & kinematics',icon:'wave',eyebrow:'Interactive animation',
  sub:'Adjust initial speed u, acceleration a and time t to see the gradient and shaded distance area update.',
  aspect:.58,maxH:245,anim:0,
  state:{u:6,a:2.0,t:8},
  ui:()=>SL('u','Initial speed u',0,15,1)+SL('a','Acceleration a',-2.0,4.0,0.5)+SL('t','Duration t',2,10,1),
  fmt:{u:v=>v+' m/s',a:v=>(Number(v)>0?'+':'')+Number(v).toFixed(1)+' m/s²',t:v=>v+' s'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const pad={l:42,r:16,t:18,b:32},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
    const tMax=10,vMax=45;
    const X=t=>pad.l+(t/tMax)*pw,Y=v=>pad.t+ph-(Math.max(0,Math.min(vMax,v))/vMax)*ph;
    c.strokeStyle=K.grid;c.lineWidth=1;
    for(let g=0;g<=5;g++){const v=g*9;c.beginPath();c.moveTo(pad.l,Y(v));c.lineTo(pad.l+pw,Y(v));c.stroke();txt(c,String(v),pad.l-6,Y(v),{col:K.muted,al:'right',s:9.5});}
    for(let g=0;g<=5;g++){const t=g*2;c.beginPath();c.moveTo(X(t),pad.t);c.lineTo(X(t),pad.t+ph);c.stroke();txt(c,t+'s',X(t),pad.t+ph+13,{col:K.muted,al:'center',s:9.5});}
    const vEnd=Math.max(0,st.u+st.a*st.t);
    // Shaded area = distance
    c.fillStyle=K.lav;
    c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(0),Y(st.u));c.lineTo(X(st.t),Y(vEnd));c.lineTo(X(st.t),Y(0));c.closePath();c.fill();
    // Axes & line
    c.strokeStyle=K.ink2;c.lineWidth=1.5;c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,pad.t+ph);c.lineTo(pad.l+pw,pad.t+ph);c.stroke();
    c.strokeStyle=K.purple;c.lineWidth=3;c.beginPath();c.moveTo(X(0),Y(st.u));c.lineTo(X(st.t),Y(vEnd));c.stroke();
    txt(c,'Area = distance',X(st.t*0.48),Y(Math.max(4,(st.u+vEnd)*0.28)),{col:K.purple,al:'center',s:11,w:800});
    txt(c,'v (m/s)',pad.l+4,11,{col:K.ink2,s:10});
  },
  read(s){
    const st=s.st,vEnd=Math.max(0,st.u+st.a*st.t);
    const dist=0.5*(st.u+vEnd)*st.t;
    return cells([['Final speed v',vEnd.toFixed(1)+' m/s'],['Distance (area)',dist.toFixed(1)+' m']]);
  }
};

/* --- T1 SIM B: Hooke's Law Spring --- */
SIMS.spring={

    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const cx=W*0.32,top=18,nat=58,extM=st.F/st.k,extPx=extM*360;
    // Support beam
    c.fillStyle=K.ink2;c.fillRect(cx-32,top-6,64,6);

SIMS.particles={
  title:'Kinetic particle model & gas pressure',icon:'spark',eyebrow:'Interactive animation',

  aspect:.56,maxH:235,anim:1,

      }

    }else if(st.st==='liquid'){
      for(let i=0;i<24;i++){
        const row=Math.floor(i/8),cl=i%8;
        const x=pad+28+cl*((bw-56)/7)+Math.sin(s.t*3*spd+i*1.7)*14;
        const y=H-pad-20-row*22+Math.cos(s.t*2.6*spd+i)*6;
        c.fillStyle=K.purple2;c.beginPath();c.arc(x,y,7.5,0,Math.PI*2);c.fill();
      }

      for(let i=0;i<18;i++){
        const vx=(Math.sin(i*7.3)*110+45)*spd,vy=(Math.cos(i*5.1)*90+35)*spd;
        let x=((i*53 + s.t*vx) % (bw-20)); if(x<0) x+=bw-20;
        let y=((i*37 + s.t*vy) % (bh-20)); if(y<0) y+=bh-20;
        // Reflect triangle wave
        const rx=pad+10+Math.abs(((i*53+s.t*vx)%(2*(bw-20)) + 2*(bw-20))%(2*(bw-20)) - (bw-20));
        const ry=pad+10+Math.abs(((i*37+s.t*vy)%(2*(bh-20)) + 2*(bh-20))%(2*(bh-20)) - (bh-20));
        c.fillStyle=st.T>450?K.orange:K.purple;c.beginPath();c.arc(rx,ry,6,0,Math.PI*2);c.fill();

/* --- T2 SIM B: Heating Curve --- */
SIMS.heat={
  title:'Heating curve of water (−20 °C to 120 °C)',icon:'spark',eyebrow:'Interactive animation',
  sub:'Slide energy supplied to see temperature pause flat during melting (0 °C) and boiling (100 °C).',
  aspect:.56,maxH:235,anim:0,
  state:{e:48},
  ui:()=>SL('e','Thermal energy supplied (progress)',0,100,2),
  fmt:{e:v=>v+'%'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),e=Number(s.st.e);
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const pad={l:42,r:16,t:18,b:30},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
    const X=u=>pad.l+(u/100)*pw,Y=t=>pad.t+ph-((t+20)/140)*ph;
    // Key points: [e, T]
    const pts=[[0,-20],[12,0],[30,0],[55,100],[88,100],[100,120]];
    c.strokeStyle=K.grid;c.lineWidth=1;
    [0,100].forEach(t=>{c.beginPath();c.moveTo(pad.l,Y(t));c.lineTo(pad.l+pw,Y(t));c.stroke();txt(c,t+'°C',pad.l-6,Y(t),{col:K.muted,al:'right',s:9.5});});
    c.strokeStyle=K.ink2;c.lineWidth=1.5;c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,pad.t+ph);c.lineTo(pad.l+pw,pad.t+ph);c.stroke();
    c.strokeStyle=K.line2;c.lineWidth=2.5;c.beginPath();pts.forEach(([u,t],i)=>i?c.lineTo(X(u),Y(t)):c.moveTo(X(u),Y(t)));c.stroke();
    // Active curve up to e
    const tempAt=u=>{
      for(let i=0;i<pts.length-1;i++){
        if(u>=pts[i][0]&&u<=pts[i+1][0]){
          const f=(u-pts[i][0])/(pts[i+1][0]-pts[i][0]);
          return pts[i][1]+f*(pts[i+1][1]-pts[i][1]);
        }
      }
      return 120;
    };
    c.strokeStyle=K.orange;c.lineWidth=3;c.beginPath();
    for(let u=0;u<=e;u+=1){const y=Y(tempAt(u));if(u===0) c.moveTo(X(u),y); else c.lineTo(X(u),y);}
    c.stroke();
    const curT=tempAt(e);
    c.fillStyle=K.purple;c.beginPath();c.arc(X(e),Y(curT),5.5,0,Math.PI*2);c.fill();
    txt(c,'Melting',X(21),Y(0)-10,{col:K.muted,al:'center',s:9.5});
    txt(c,'Boiling',X(71),Y(100)-10,{col:K.muted,al:'center',s:9.5});
    txt(c,'Energy supplied →',pad.l+pw/2,H-10,{col:K.ink2,al:'center',s:10.5});
  },
  read(s){
    const e=Number(s.st.e);
    let stage='Solid ice heating',tStr='';
    if(e<12){stage='Solid ice warming';tStr=(-20+(e/12)*20).toFixed(0)+' °C';}
    else if(e<=30){stage='Melting (PE rising, T flat)';tStr='0 °C';}
    else if(e<55){stage='Liquid water warming';tStr=((e-30)/25*100).toFixed(0)+' °C';}
    else if(e<=88){stage='Boiling (PE rising, T flat)';tStr='100 °C';}
    else{stage='Steam warming';tStr=(100+(e-88)/12*20).toFixed(0)+' °C';}
    return cells([['Current stage',stage],['Temperature',tStr]]);
  }
};

SIMS.circuit={
  title:'Series vs. parallel circuit simulator',icon:'spark',eyebrow:'Interactive animation',
  sub:'Switch between series and parallel and adjust R₁, R₂ and V to see current flow and total resistance.',
  aspect:.58,maxH:245,anim:1,
  state:{mode:'par',V:12,R1:6,R2:3},
  ui:()=>CH('mode',[['ser','Series'],['par','Parallel']])+SL('V','Supply V',3,24,3)+SL('R1','Resistor R₁',2,12,2)+SL('R2','Resistor R₂',2,12,2),

      [ [rx1,'R₁='+st.R1+'Ω'], [rx2,'R₂='+st.R2+'Ω'] ].forEach(([rx,lb])=>{
        c.fillStyle=K.lav;c.strokeStyle=K.purple;c.lineWidth=2;
        c.fillRect(rx,y1-11,56,22);c.strokeRect(rx,y1-11,56,22);
        txt(c,lb,rx+28,y1,{col:K.purple,al:'center',s:10.5,w:800});
      });
    }else{
      c.strokeRect(x1,y1,x2-x1,y2-y1);
      c.beginPath();c.moveTo(x1,ym);c.lineTo(x2,ym);c.stroke();
      const rx=(x1+x2)/2-30;
      [ [y1,'R₁='+st.R1+'Ω'], [ym,'R₂='+st.R2+'Ω'] ].forEach(([ry,lb])=>{
        c.fillStyle=K.lav;c.strokeStyle=K.purple;c.lineWidth=2;
        c.fillRect(rx,ry-11,60,22);c.strokeRect(rx,ry-11,60,22);
        txt(c,lb,rx+30,ry,{col:K.purple,al:'center',s:10.5,w:800});
      });

    const spd=Math.min(180,25+Itot*18);
    for(let i=0;i<6;i++){

    const Itot=st.V/Rtot;
    return cells([['Combined R',Rtot.toFixed(2)+' Ω'],['Total current I',Itot.toFixed(2)+' A'],['Power P = VI',(st.V*Itot).toFixed(1)+' W'],['Circuit type',st.mode==='ser'?'Series (I same)':'Parallel (V same)']]);
  }
};

SIMS.trans={
  title:'Step-up & step-down transformer',icon:'spark',eyebrow:'Interactive animation',

  aspect:.54,maxH:225,anim:1,

    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,cw=W*0.56,ch=H*0.64;
    // Soft iron core
    c.strokeStyle=K.line2;c.lineWidth=16;c.strokeRect(cx-cw/2,cy-ch/2,cw,ch);
    // Alternating magnetic flux lines
    const flux=Math.sin(s.t*4.5);
    c.strokeStyle=flux>0?K.purple:K.orange;c.lineWidth=2;c.setLineDash([6,5]);
    c.strokeRect(cx-cw/2,cy-ch/2,cw,ch);c.setLineDash([]);
    // Primary & secondary coils
    const drawCoil=(x,n,colr)=>{
      const loops=Math.max(3,Math.min(10,Math.round(n/80)));
      c.strokeStyle=colr;c.lineWidth=2.6;
      for(let i=0;i<loops;i++){
        const y=cy-ch*0.35 + (i/(loops-1||1))*(ch*0.7);
        c.beginPath();c.moveTo(x-12,y);c.lineTo(x+12,y);c.stroke();
      }
    };
    drawCoil(cx-cw/2,st.Np,K.orange);
    drawCoil(cx+cw/2,st.Ns,K.green);
    txt(c,'Primary AC',cx-cw/2-18,cy,{col:K.orange,al:'right',s:10.5,w:800});
    txt(c,'Secondary',cx+cw/2+18,cy,{col:K.green,al:'left',s:10.5,w:800});

};

/* --- T5 SIM B: Half-life Decay --- */
SIMS.decay={
  title:'Radioactive half-life simulator',icon:'wave',eyebrow:'Interactive animation',
  sub:'Advance time t to watch half the remaining unstable nuclei decay every half-life t½.',
  aspect:.56,maxH:235,anim:0,
  state:{hl:2,t:2},
  ui:()=>SL('hl','Half-life t½',1,5,1)+SL('t','Time elapsed t',0,10,1),
  fmt:{hl:v=>v+' h',t:v=>v+' h'},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),st=s.st;
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const frac=Math.pow(0.5,st.t/st.hl),rem=Math.round(64*frac);
    // Left: 8x8 nuclei grid
    const gx=14,gy=22,cell=Math.min(18,(W*0.42)/8);
    for(let i=0;i<64;i++){
      const order=(i*29+7)%64;
      const alive=order<rem;
      c.fillStyle=alive?K.purple:K.line2;
      c.beginPath();c.arc(gx+(i%8)*cell+cell/2,gy+Math.floor(i/8)*cell+cell/2,cell*0.36,0,Math.PI*2);c.fill();
    }
    txt(c,'Undecayed nuclei',gx,12,{col:K.purple,s:10.5});
    // Right: Decay curve
    const px=W*0.50,py=22,pw=W*0.45,ph=H-46;
    c.strokeStyle=K.ink2;c.lineWidth=1.4;c.beginPath();c.moveTo(px,py);c.lineTo(px,py+ph);c.lineTo(px+pw,py+ph);c.stroke();
    c.strokeStyle=K.orange;c.lineWidth=2.4;c.beginPath();
    for(let u=0;u<=10;u+=0.25){

  }
};

/* --- GENERIC VIRTUAL LAB APPARATUS & GRAPH FOR TOPICS 1, 2, 4, 5, 6 --- */
function genLabAnalysis(){
  const cfg=curP().lab,lb=TS().lab;
  const pts=lb.rows.filter(r=>r.r1!=null).map(r=>{
    const rm=r.r2!=null?(r.r1+r.r2)/2:r.r1;
    const dy=r.r2!=null?Math.max(cfg.divErr,Math.abs(r.r1-r.r2)/2):cfg.divErr;
    return cfg.toXY(r.i,rm,dy);
  }).sort((a,b)=>a.x-b.x);
  if(pts.length<2) return {pts,ready:false};
  const n=pts.length;
  const sx=pts.reduce((a,p)=>a+p.x,0),sy=pts.reduce((a,p)=>a+p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0),sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const denom=n*sxx-sx*sx;
  const m=denom?((n*sxy-sx*sy)/denom):cfg.trueSlope;
  const b=(sy-m*sx)/n;
  const p0=pts[0],p1=pts[pts.length-1];
  const dSpan=Math.max(0.01,(p1.x-p1.dx)-(p0.x+p0.dx));
  const mWorst=(p1.y-p0.y)/dSpan;
  const bWorst=p0.y-mWorst*(p0.x+p0.dx);
  const dm=Math.abs(mWorst-m),pct=m?Math.abs(dm/m)*100:0;
  return {pts,ready:pts.length>=5,m,b,mWorst,bWorst,dm,pct};
}

SIMS.genlab={
  title:'Virtual practical apparatus',icon:'flask',eyebrow:'Step 1 · Take readings',
  sub:'Adjust the independent variable, read the magnified scale, and record two repeat readings.',
  aspect:.58,maxH:245,anim:0,
  state:{val:0},
  ui(){
    const cfg=curP().lab;
    if(!SST.genlab || SST.genlab.code!==S.code) SST.genlab={val:cfg.defVal,code:S.code};
    return SL('val',cfg.xLbl,cfg.min,cfg.max,cfg.step)+
      `<div class="between" style="margin-top:4px"><button type="button" class="btn btn-o btn-s" data-act="record">Record reading (y₁ / y₂)</button><span class="sub num">2 repeats per setting</span></div>`;
  },
  fmt:{val:v=>v},
  act(s,name){
    if(name==='record'){
      const cfg=curP().lab,lb=TS().lab,xVal=Number(s.st.val);
      const yTrue=cfg.fnY(xVal);
      let row=lb.rows.find(r=>r.i===xVal);
      const snap=v=>Math.round(v/cfg.divErr)*cfg.divErr;
      if(!row){
        const y1=Math.max(0.01,snap(yTrue+seededNoise(lb.seed,xVal,1)*cfg.noiseAmp));
        lb.rows.push({i:xVal,r1:Number(y1.toFixed(2)),r2:null});
        lb.rows.sort((a,b)=>a.i-b.i);
        toast(`Recorded y₁ = ${y1.toFixed(2)} — tap again for y₂`);
      }else if(row.r2===null){
        const y2=Math.max(0.01,snap(yTrue+seededNoise(lb.seed,xVal,2)*cfg.noiseAmp));
        row.r2=Number(y2.toFixed(2));
        toast(`Recorded y₂ = ${y2.toFixed(2)}`);
      }else{
        toast('Already have 2 repeats for this value. Try another setting!');
        return;
      }
      save();render();
    }
  },
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),cfg=curP().lab,lb=TS().lab;
    const xVal=Number(s.st.val);
    const row=lb.rows.find(r=>r.i===xVal);
    const rep=row&&row.r2===null?2:1;
    const snap=v=>Math.round(v/cfg.divErr)*cfg.divErr;
    const yMeas=Math.max(0.01,snap(cfg.fnY(xVal)+seededNoise(lb.seed,xVal,rep)*cfg.noiseAmp));
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    // Left: Apparatus schematic gauge
    const gx=18,gy=22,gw=W*0.46,gh=H-44;
    c.fillStyle=K.card;c.strokeStyle=K.line2;c.lineWidth=1.5;
    c.beginPath();c.roundRect(gx,gy,gw,gh,16);c.fill();c.stroke();
    txt(c,cfg.title,gx+12,gy+20,{col:K.purple,s:11,w:800});
    txt(c,`${cfg.xLbl}: ${xVal}`,gx+12,gy+46,{col:K.ink,s:13,w:800});
    // Progress bar inside apparatus
    const frac=(xVal-cfg.min)/Math.max(1,cfg.max-cfg.min);
    c.fillStyle=K.lav;c.beginPath();c.roundRect(gx+12,gy+66,gw-24,14,7);c.fill();
    c.fillStyle=K.purple;c.beginPath();c.roundRect(gx+12,gy+66,Math.max(10,(gw-24)*frac),14,7);c.fill();
    txt(c,`Repeat #${rep} ready`,gx+12,gy+gh-18,{col:K.muted,s:11});
    // Right: Magnified scale zoom window
    const zx=W*0.54,zy=18,zw=W*0.41,zh=H-36;
    c.fillStyle=K.card;c.strokeStyle=K.purple;c.lineWidth=1.8;
    c.beginPath();c.roundRect(zx,zy,zw,zh,16);c.fill();c.stroke();
    txt(c,'Zoom scale ('+cfg.yLbl+')',zx+zw/2,zy+16,{col:K.muted,al:'center',s:10});
    // Ticks around yMeas
    const midY=zy+zh*0.54;
    for(let k=-4;k<=4;k++){
      const ty=midY+k*12;
      c.strokeStyle=k===0?K.orange:K.line2;c.lineWidth=k===0?2.4:1.2;
      c.beginPath();c.moveTo(zx+16,ty);c.lineTo(zx+(k%2===0?38:28),ty);c.stroke();
    }
    txt(c,yMeas.toFixed(2),zx+zw*0.64,midY,{col:K.purple,al:'center',s:19,w:800});
    txt(c,'±'+cfg.divErr,zx+zw*0.64,midY+22,{col:K.muted,al:'center',s:10.5});
  },
  read(s){
    const cfg=curP().lab,lb=TS().lab,xVal=Number(s.st.val);
    const row=lb.rows.find(r=>r.i===xVal),rep=row&&row.r2===null?2:1;
    const snap=v=>Math.round(v/cfg.divErr)*cfg.divErr;
    const yMeas=Math.max(0.01,snap(cfg.fnY(xVal)+seededNoise(lb.seed,xVal,rep)*cfg.noiseAmp));
    return cells([[cfg.xLbl,xVal],[cfg.yLbl,yMeas.toFixed(2)]]);
  }
};

SIMS.gengraph={
  title:'Linearised results graph',icon:'ray',eyebrow:'Step 3 · Plot the graph',
  sub:'Purple = least-squares best-fit line. Orange dashed = worst acceptable line through error bars.',
  aspect:.74,maxH:290,anim:0,state:{},ui:()=>'',fmt:{},
  frame(s){
    const c=s.c,W=s.W,H=s.H,K=col(),cfg=curP().lab,an=genLabAnalysis();
    c.clearRect(0,0,W,H);c.fillStyle=K.stage;c.fillRect(0,0,W,H);
    const pad={l:46,r:16,t:18,b:36},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
    const X=v=>pad.l+(v/cfg.xMax)*pw,Y=v=>pad.t+ph-(v/cfg.yMax)*ph;
    c.strokeStyle=K.grid;c.lineWidth=1;
    for(let g=0;g<=5;g++){
      const vx=(g/5)*cfg.xMax,vy=(g/5)*cfg.yMax;
      c.beginPath();c.moveTo(X(vx),pad.t);c.lineTo(X(vx),pad.t+ph);c.stroke();
      txt(c,cfg.xMax<2?vx.toFixed(2):vx.toFixed(0),X(vx),pad.t+ph+14,{col:K.muted,al:'center',s:9.5});
      c.beginPath();c.moveTo(pad.l,Y(vy));c.lineTo(pad.l+pw,Y(vy));c.stroke();
      txt(c,cfg.yMax<10?vy.toFixed(1):vy.toFixed(0),pad.l-8,Y(vy),{col:K.muted,al:'right',s:9.5});
    }
    c.strokeStyle=K.ink2;c.lineWidth=1.6;
    c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,pad.t+ph);c.lineTo(pad.l+pw,pad.t+ph);c.stroke();
    txt(c,cfg.gxLbl,pad.l+pw/2,H-10,{col:K.ink,al:'center',s:11,w:800});
    c.save();c.translate(14,pad.t+ph/2);c.rotate(-Math.PI/2);txt(c,cfg.gyLbl,0,0,{col:K.ink,al:'center',s:11,w:800});c.restore();
    if(an.pts.length>=2){
      c.strokeStyle=K.purple;c.lineWidth=2.4;
      c.beginPath();c.moveTo(X(0),Y(an.b));c.lineTo(X(cfg.xMax),Y(an.m*cfg.xMax+an.b));c.stroke();
      c.strokeStyle=K.orange;c.lineWidth=1.8;c.setLineDash([5,4]);
      c.beginPath();c.moveTo(X(0),Y(an.bWorst));c.lineTo(X(cfg.xMax),Y(an.mWorst*cfg.xMax+an.bWorst));c.stroke();
      c.setLineDash([]);
    }
    an.pts.forEach(p=>{
      const px=X(p.x),py=Y(p.y),ex=Math.max(4,(p.dx/cfg.xMax)*pw);
      c.strokeStyle=K.ink2;c.lineWidth=1.4;
      c.beginPath();c.moveTo(px-ex,py);c.lineTo(px+ex,py);c.stroke();
      c.fillStyle=K.purple;c.beginPath();c.arc(px,py,4.2,0,Math.PI*2);c.fill();
    });
    if(!an.pts.length) txt(c,'Record readings above to plot points',pad.l+pw/2,pad.t+ph/2,{col:K.muted,al:'center',s:12});
  },
  read(){
    const an=genLabAnalysis();
    if(an.pts.length<2) return '';
    return cells([['Best-fit gradient',an.m.toFixed(2)],['Worst gradient',an.mWorst.toFixed(2)]]);
  }
};

  'M3.1':{name:'Straight-line graphs, gradient & midpoint',chId:3,chName:'Coordinate geometry',explore:'m_graph',
    prereq:['<strong>y = mx + c:</strong> m is the gradient (slope) and c is the y-intercept.'],
    objs:[['3.1','Calculate gradient, length and midpoint of a line segment between two points.'],['3.4','Find equations of parallel lines (same m) and perpendicular lines (m₁ × m₂ = −1).']],
    pts:['<strong>Gradient m = (y₂ − y₁) / (x₂ − x₁)</strong>. Parallel lines have the exact same gradient (m₁ = m₂).','<strong>Perpendicular lines:</strong> gradients are negative reciprocals: <strong>m₁ × m₂ = −1</strong> (e.g. m = 2 → perpendicular m = −½).','<strong>Distance & Midpoint:</strong> length = √((x₂ − x₁)² + (y₂ − y₁)²); midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2).'],
    ur:'<strong>Parallel lines ka gradient barabar hota hai (m₁ = m₂).</strong> Perpendicular lines ka gradient ulta aur opposite sign hota hai (m₁ × m₂ = −1), maslan 3 ka perpendicular −1/3 hoga.',
    urdu:'متوازی خطوط کی ڈھلان برابر ہوتی ہے جبکہ عمودی خطوط کی ڈھلان کا حاصل ضرب 1− ہوتا ہے۔',
    eqs:[[`<i>m</i> = ${fr('<i>y</i><sub>2</sub> − <i>y</i><sub>1</sub>','<i>x</i><sub>2</sub> − <i>x</i><sub>1</sub>')}`,'Gradient'],[`<i>m</i><sub>1</sub> × <i>m</i><sub>2</sub> = −1`,'Perpendicular lines']],
    we:{q:'Find the equation of the line perpendicular to y = 2x + 1 passing through (4, 5).',s:['Given m₁ = 2, so perpendicular gradient m₂ = −½.','Substitute (4, 5) into y = −½x + c: 5 = −2 + c → c = 7.'],a:'y = −½x + 7'},
    tip:['Examiner tip','To find a perpendicular bisector of AB, always do three steps: (1) midpoint M of AB, (2) gradient of AB then negative reciprocal m₂, (3) plug M and m₂ into y = mx + c.'],
    fcs:[{tag:'Formula · 3.1',front:'Midpoint of (x₁, y₁) & (x₂, y₂)',back:'((x₁ + x₂)/2, (y₁ + y₂)/2).'},{tag:'Rule · 3.4',front:'Perpendicular gradient to m = a/b',back:'−b/a (flip the fraction and reverse the sign).'}],
    mcqs:[{q:'Find the gradient of the line joining A(1, 3) and B(5, 11).',o:['0.5','2','4','8'],a:1,e:'m = (11 − 3) / (5 − 1) = 8 / 4 = 2.',obj:'3.1'},{q:'Which line is perpendicular to y = 3x − 2?',o:['y = 3x + 5','y = −3x + 1','y = −(1/3)x + 4','y = (1/3)x − 2'],a:2,e:'Negative reciprocal of 3 is −1/3.',obj:'3.4'}],
    sq:[{id:'A',title:'Perpendicular bisector',paper:'Paper 2 style',sub:'3.1 · 3.4',stem:'Points A(2, 1) and B(6, 9) lie on a coordinate plane.',parts:[
      {k:'a',cw:'Calculate',q:'the midpoint M and exact length AB.',m:3,ms:[['B1','M = ((2+6)/2, (1+9)/2) = (4, 5)'],['M1','AB = √((6−2)² + (9−1)²) = √(16 + 64) = √80'],['A1','8.94 units (3 s.f.)']]},
      {k:'b',cw:'Work out',q:'the equation of the perpendicular bisector of AB.',m:3,ms:[['M1','Gradient AB = (9−1)/(6−2) = 2 → m⊥ = −½'],['M1','5 = −½(4) + c → c = 7'],['A1','y = −½x + 7']]}

    life:['images/photo-42.webp','GPS & map coordinate routing','Navigation apps use coordinate distance √(Δx² + Δy²) and linear gradients to compute shortest straight-line paths and road slopes.','3.1','Calculate the distance between grid points (0, 0) and (6, 8) in km.']

  'M4.1':{name:'Angles, polygons, similarity & congruence',chId:4,chName:'Geometry',explore:'m_trig',
    prereq:['<strong>Parallel lines:</strong> alternate (Z) angles are equal, corresponding (F) angles are equal, co-interior (C) angles sum to 180°.'],
    objs:[['4.6','Calculate interior and exterior angles of polygons (sum of exterior angles = 360°).'],['4.4','Use congruence (SSS, SAS, ASA, RHS) and similarity (length ratio k, area ratio k², volume ratio k³).']],
    pts:['<strong>Polygon angles:</strong> sum of exterior angles of ANY convex polygon is <strong>360°</strong>. For a regular n-gon, each exterior angle = 360°/n and interior = 180° − exterior.','<strong>Similar shapes:</strong> if linear scale factor is k = L₂/L₁, then <strong>Area ratio = k²</strong> and <strong>Volume ratio = k³</strong>.','<strong>Congruent triangles:</strong> prove using SSS, SAS, ASA, or RHS (never AAA — that only proves similarity!).'],
    ur:'<strong>Similar shapes mein sab se zaroori rule:</strong> agar length k guna barhti hai to <strong>Area k²</strong> guna aur <strong>Volume k³</strong> guna barhta hai!',
    urdu:'مشابہ اشکال میں اگر لمبائی k گنا ہو تو رقبہ k² اور حجم k³ گنا ہوتا ہے۔',
    eqs:[[`Interior sum = (<i>n</i> − 2) × 180°`,'n-sided polygon'],[`${fr('<i>A</i><sub>2</sub>','<i>A</i><sub>1</sub>')} = (${fr('<i>L</i><sub>2</sub>','<i>L</i><sub>1</sub>')})<sup>2</sup>`,'Similar areas'],[`${fr('<i>V</i><sub>2</sub>','<i>V</i><sub>1</sub>')} = (${fr('<i>L</i><sub>2</sub>','<i>L</i><sub>1</sub>')})<sup>3</sup>`,'Similar volumes']],
    we:{q:'Two similar bottles have heights 10 cm and 15 cm. The smaller holds 400 cm³. Find the volume of the larger bottle.',s:['Length scale factor k = 15 / 10 = 1.5.','Volume ratio = k³ = 1.5³ = 3.375.','V₂ = 400 × 3.375.'],a:'1350 cm³'},
    tip:['Common mistake','Students often multiply volume by k instead of k³! Always cube the length ratio for volume and square it for area.','warn'],
    fcs:[{tag:'Formula · 4.6',front:'Exterior angle of regular n-gon',back:'360° ÷ n (and interior + exterior = 180°).'},{tag:'Rule · 4.4',front:'Similar area & volume ratios',back:'Area scales by k²; Volume scales by k³.'}],
    mcqs:[{q:'Each exterior angle of a regular polygon is 40°. How many sides does it have?',o:['6','8','9','10'],a:2,e:'n = 360° / 40° = 9 sides (nonagon).',obj:'4.6'},{q:'Two similar triangles have sides in ratio 2 : 5. What is the ratio of their areas?',o:['2 : 5','4 : 25','8 : 125','4 : 10'],a:1,e:'Area ratio = 2² : 5² = 4 : 25.',obj:'4.4'}],
    sq:[{id:'A',title:'Similar solids',paper:'Paper 2 style',sub:'4.4',stem:'Two geometrically similar metal statues have heights 12 cm and 18 cm. The smaller statue has surface area 200 cm².',parts:[
      {k:'a',cw:'Calculate',q:'the surface area of the larger statue.',m:2,ms:[['M1','k = 18/12 = 1.5 → Area = 200 × 1.5²'],['A1','450 cm²']]}
    ]}],
    life:['images/photo-43.webp','Architectural scale models','Architects build 1:100 scale models of buildings; every 1 cm² of model glass represents 100² = 10 000 cm² (1 m²) of real facade glass.','4.4','A 1:50 scale model car has a painted surface area of 40 cm². Calculate the real car’s surface area in m².']

  'M4.2':{name:'Circle theorems & symmetry',chId:4,chName:'Geometry',explore:'m_trig',
    prereq:['<strong>Isosceles radii:</strong> any triangle formed by two radii and a chord is isosceles (equal base angles).'],
    objs:[['4.7','Apply all O Level circle theorems (angle in semicircle = 90°, centre = 2× circumference, same segment, cyclic quadrilateral, tangent ⊥ radius, alternate segment).']],
    pts:['<strong>Angle in a semicircle = 90°</strong>; <strong>Angle at centre = 2 × angle at circumference</strong> (on the same arc).','<strong>Angles in the same segment are equal</strong>; opposite angles of a <strong>cyclic quadrilateral sum to 180°</strong>.','<strong>Tangent meets radius at 90°</strong>; tangents from an external point are equal; <strong>alternate segment theorem:</strong> angle between tangent and chord equals angle in alternate segment.'],
    ur:'<strong>Circle theorems ke sawal mein har step ke saath reason zaroor likho!</strong> Sab se zyada aane wale rules: semicircle = 90°, centre angle = circumference ka double, aur cyclic quad ke opposite angles ka sum = 180°.',
    urdu:'دائرے کے مسائل حل کرتے وقت ہر زاویے کے ساتھ اس کا جومیٹری اصول ضرور تحریر کریں۔',
    eqs:[[`∠ centre = 2 × ∠ circumference`,'Same arc'],[`Opposite ∠ in cyclic quad = 180°`,'All 4 vertices on circle']],
    we:{q:'A, B, C, D lie on a circle with centre O. If ∠AOC = 116°, find ∠ABC (reflex or acute) and ∠ADC.',s:['Angle at circumference = ½ × 116° = 58° (acute ∠ADC).','Opposite angle in cyclic quad ABCD: ∠ABC = 180° − 58°.'],a:'∠ADC = 58°, ∠ABC = 122°'},
    tip:['Examiner tip','When asked to "give a reason for your answer", use exact Cambridge phrasing like "angles in the same segment are equal" or "opposite angles of a cyclic quadrilateral sum to 180°".'],
    fcs:[{tag:'Theorem · 4.7',front:'Angle between tangent and radius',back:'Always 90° at the point of contact.'},{tag:'Theorem · 4.7',front:'Cyclic quadrilateral rule',back:'Opposite angles sum to 180°.'}],
    mcqs:[{q:'PQ is a diameter of a circle and R lies on the circumference. What is ∠PRQ?',o:['45°','60°','90°','180°'],a:2,e:'Angle in a semicircle is always 90°.',obj:'4.7'}],
    sq:[{id:'A',title:'Tangent & cyclic quadrilateral',paper:'Paper 2 style',sub:'4.7',stem:'A tangent PT touches a circle of centre O at T. Angle OPT = 34°.',parts:[
      {k:'a',cw:'Calculate',q:'angle TOP, giving your geometric reason.',m:2,ms:[['B1','∠OTP = 90° (tangent is perpendicular to radius at point of contact)'],['A1','∠TOP = 180° − 90° − 34° = 56°']]}
    ]}],
    life:['images/photo-44.webp','Optical circular apertures & tangents','Camera iris blades and satellite horizons use tangent-to-circle geometry to calculate exact line-of-sight distance to Earth’s curved horizon.','4.7','A tangent meets a circle of radius 6 cm at T, and external point P is 10 cm from centre O. Calculate tangent length PT.']

  'M5.1':{name:'Area, arcs, sectors & 3D volume',chId:5,chName:'Mensuration',explore:'m_trig',
    prereq:['<strong>Circle basics:</strong> Circumference = 2πr; Area = πr².'],
    objs:[['5.3','Calculate arc length and sector area using θ/360°.'],['5.4','Calculate surface area and volume of prisms, cylinders, cones, pyramids and spheres.']],
    pts:['<strong>Arc length = (θ / 360) × 2πr</strong>; <strong>Sector area = (θ / 360) × πr²</strong>.','<strong>Cylinder:</strong> V = πr²h; curved surface area = 2πrh. <strong>Prism:</strong> V = cross-sectional area × length.','<strong>Cone & Sphere (formulas given on 4024 formula sheet):</strong> Cone V = ⅓πr²h, CSA = πrl; Sphere V = ⁴⁄₃πr³, SA = 4πr².'],
    ur:'<strong>Sector area aur arc length mein sirf θ/360 se multiply karna hota hai!</strong> Yaad rakho: sector ka perimeter nikalte waqt arc length ke saath <strong>do radii (+ 2r)</strong> bhi add karne hote hain.',
    urdu:'سیکٹر کا احاطہ معلوم کرتے وقت قوس کی لمبائی میں دونوں رداس (2r) شامل کرنا نہ بھولیں۔',
    eqs:[[`Arc = ${fr('<i>θ</i>','360')} × 2<i>π</i><i>r</i>`,'Arc length'],[`Sector = ${fr('<i>θ</i>','360')} × <i>π</i><i>r</i><sup>2</sup>`,'Sector area']],
    we:{q:'A sector of radius 9.0 cm has angle 80°. Calculate its arc length and area (3 s.f.).',s:['Arc = (80/360) × 2π(9) = 4π = 12.6 cm.','Area = (80/360) × π(81) = 18π = 56.5 cm².'],a:'Arc = 12.6 cm, Area = 56.5 cm²'},
    tip:['Common mistake','When asked for the PERIMETER of a sector, students often stop at arc length and forget to add the two straight radii (+ 2r)!','warn'],
    fcs:[{tag:'Formula · 5.3',front:'Perimeter of a sector',back:'Arc length + 2r = (θ/360) × 2πr + 2r.'},{tag:'Formula · 5.4',front:'Volume of a cylinder',back:'V = πr²h.'}],
    mcqs:[{q:'A cone has radius 3 cm and vertical height 10 cm. What is its volume in terms of π?',o:['30π cm³','90π cm³','10π cm³','60π cm³'],a:0,e:'V = ⅓πr²h = ⅓ × π × 9 × 10 = 30π cm³.',obj:'5.4'}],
    sq:[{id:'A',title:'Sector & cylinder tank',paper:'Paper 2 style',sub:'5.3 · 5.4',stem:'A cylindrical water tank has internal radius 0.60 m and height 1.50 m.',parts:[
      {k:'a',cw:'Calculate',q:'the volume of water the full tank holds in litres (1 m³ = 1000 litres).',m:3,ms:[['M1','V = π × 0.60² × 1.50 = 1.696 m³'],['M1','Multiply by 1000'],['A1','1700 litres (3 s.f.)']]}
    ]}],
    life:['images/photo-45.webp','Cylindrical storage tanks & packaging','Beverage cans and rooftop water tanks minimise surface area (2πr² + 2πrh) for a given volume (πr²h) to cut material costs.','5.4','Calculate the curved surface area of a cylindrical tin of radius 4 cm and height 10 cm.']
  },
  'M6.1':{name:'Pythagoras, SOHCAHTOA & bearings',chId:6,chName:'Trigonometry',explore:'m_trig',
    prereq:['<strong>Calculator check:</strong> make sure your calculator is in <strong>DEG (degrees)</strong> mode, never RAD!'],
    objs:[['6.1','Apply Pythagoras’ theorem and sin, cos, tan to right-angled triangles.'],['6.2','Interpret and calculate three-figure bearings (measured clockwise from North).']],
    pts:['<strong>SOHCAHTOA:</strong> sin θ = Opp/Hyp, cos θ = Adj/Hyp, tan θ = Opp/Adj.','<strong>Three-figure bearings:</strong> always measured (1) from North, (2) clockwise, (3) written with 3 digits (e.g. 045°, not 45°).','<strong>Back bearing:</strong> if bearing of B from A is θ, bearing of A from B is θ + 180° (if θ < 180°) or θ − 180° (if θ ≥ 180°).'],
    ur:'<strong>Bearings ke 3 golden rules:</strong> hamesha North se start karo, clockwise ghoomo, aur 3 digits mein likho (jaise 065°). Calculator hamesha DEG mode mein rakho!',
    urdu:'بیرنگ ہمیشہ شمال سے گھڑی کی سمت میں ناپی جاتی ہے اور تین ہندسوں میں لکھی جاتی ہے۔',
    eqs:[[`<i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> = <i>c</i><sup>2</sup>`,'Pythagoras'],[`sin <i>θ</i> = ${fr('Opp','Hyp')}, cos <i>θ</i> = ${fr('Adj','Hyp')}, tan <i>θ</i> = ${fr('Opp','Adj')}`,'Right-angled Δ']],
    we:{q:'A ladder 6.0 m long leans against a vertical wall making 68° with the horizontal ground. How high up the wall does it reach?',s:['Height is Opposite to 68°; ladder is Hypotenuse.','h = 6.0 × sin 68° = 5.56 m.'],a:'5.56 m (3 s.f.)'},
    tip:['Examiner tip','Always draw a small North arrow at BOTH points A and B in bearing questions so you can use co-interior (180°) angles cleanly.'],
    fcs:[{tag:'Rule · 6.2',front:'Three rules of a bearing',back:'Measured from North, clockwise, written as 3 figures (e.g. 072°).'},{tag:'Formula · 6.1',front:'Finding an angle with tan',back:'θ = tan⁻¹(Opposite ÷ Adjacent).'}],
    mcqs:[{q:'The bearing of B from A is 070°. What is the bearing of A from B?',o:['110°','250°','290°','070°'],a:1,e:'70° + 180° = 250°.',obj:'6.2'}],
    sq:[{id:'A',title:'Right-angled triangle & bearing',paper:'Paper 2 style',sub:'6.1 · 6.2',stem:'A ship sails 12 km due East from port P to Q, then 9 km due South to R.',parts:[
      {k:'a',cw:'Calculate',q:'the straight-line distance PR and the bearing of R from P.',m:4,ms:[['M1','PR = √(12² + 9²) = 15 km'],['A1','15 km'],['M1','tan θ = 9/12 → θ = 36.9° south of east'],['A1','Bearing = 090° + 36.9° = 127° (nearest degree)']]}
    ]}],
    life:['images/photo-46.webp','Maritime navigation & bearings','Ship captains and pilots plot courses using three-figure bearings from True North and trigonometric drift corrections.','6.2','If a port lies on a bearing of 235° from a ship, state the bearing of the ship from the port.']
  },
  'M6.2':{name:'Sine rule, cosine rule & 3D trigonometry',chId:6,chName:'Trigonometry',explore:'m_trig',
    prereq:['<strong>Non-right-angled triangles:</strong> SOHCAHTOA ONLY works for 90° triangles; use Sine or Cosine Rule for all other triangles!'],
    objs:[['6.5','Use the sine rule, cosine rule and area = ½ab sin C for any triangle, including obtuse angles and 3D problems.']],
    pts:['<strong>Sine rule:</strong> a / sin A = b / sin B (use when you have an opposite side–angle pair).','<strong>Cosine rule:</strong> a² = b² + c² − 2bc cos A (use for SAS — two sides & included angle — or SSS to find an angle).','<strong>Area of any triangle:</strong> Area = ½ab sin C (two sides and the included angle).'],
    ur:'<strong>Non-right triangle mein choose kaise karein?</strong> Agar ek side aur uska opposite angle dono maloom hon to <strong>Sine Rule</strong> lagao; agar 2 sides aur beech ka angle (SAS) ya teeno sides (SSS) hon to <strong>Cosine Rule</strong>!',
    urdu:'غیر قائمہ مثلث میں دو اضلاع اور درمیانی زاویہ معلوم ہو تو کوسائن رول استعمال کریں۔',
    eqs:[[`${fr('<i>a</i>','sin <i>A</i>')} = ${fr('<i>b</i>','sin <i>B</i>')}`,'Sine rule'],[`<i>a</i><sup>2</sup> = <i>b</i><sup>2</sup> + <i>c</i><sup>2</sup> − 2<i>b</i><i>c</i> cos <i>A</i>`,'Cosine rule'],[`Area = ½<i>a</i><i>b</i> sin <i>C</i>`,'Any triangle']],
    we:{q:'In triangle ABC, b = 8 cm, c = 11 cm and ∠A = 60°. Calculate side a and the area of ΔABC.',s:['a² = 8² + 11² − 2(8)(11)cos 60° = 64 + 121 − 88 = 97 → a = √97 = 9.85 cm.','Area = ½ × 8 × 11 × sin 60° = 38.1 cm².'],a:'a = 9.85 cm, Area = 38.1 cm²'},
    tip:['Common mistake','In cosine rule a² = b² + c² − 2bc cos A, do NOT forget to take the square root at the end to get a!','warn'],
    fcs:[{tag:'Formula · 6.5',front:'Cosine rule for angle A',back:'cos A = (b² + c² − a²) / (2bc).'},{tag:'Formula · 6.5',front:'Area of non-right triangle',back:'Area = ½ab sin C.'}],
    mcqs:[{q:'Which rule finds the third side of a triangle when two sides and the included angle (SAS) are known?',o:['SOHCAHTOA','Pythagoras','Sine rule','Cosine rule'],a:3,e:'SAS (no opposite side–angle pair) requires the Cosine Rule.',obj:'6.5'}],
    sq:[{id:'A',title:'Cosine rule & triangle area',paper:'Paper 2 style',sub:'6.5',stem:'Triangle PQR has PQ = 7.5 cm, PR = 9.2 cm and ∠QPR = 110°.',parts:[
      {k:'a',cw:'Calculate',q:'the length QR and the area of triangle PQR.',m:4,ms:[['M1','QR² = 7.5² + 9.2² − 2(7.5)(9.2)cos 110° = 188.09'],['A1','QR = 13.7 cm (3 s.f.)'],['M1','Area = ½ × 7.5 × 9.2 × sin 110°'],['A1','32.4 cm²']]}
    ]}],
    life:['images/photo-47.webp','Triangulation & surveying','Land surveyors measure distances across rivers and mountain valleys using the sine and cosine rules from two known base stations.','6.5','Why can a surveyor find the width of a river without crossing it using the sine rule?']
  },
  'M7.1':{name:'2D vectors & vector geometry',chId:7,chName:'Transformations and vectors',explore:'m_trans',
    prereq:['<strong>Column vector (x / y):</strong> top number = horizontal shift (+ right, − left); bottom number = vertical shift (+ up, − down).'],
    objs:[['7.2','Add, subtract and multiply column vectors by scalars, calculate magnitude |v| = √(x² + y²), and solve vector geometry proofs.']],
    pts:['<strong>Magnitude:</strong> |(x, y)| = √(x² + y²). Reversing a vector negates it: BA = −AB.','<strong>Vector pathway:</strong> to go from A to C, travel via any known route: AC = AB + BC.','<strong>Parallel & collinear proof:</strong> if PQ = k × RS, the vectors are parallel; if they also share a common point, the three points are collinear (lie on one straight line).'],
    ur:'<strong>Vector rasta dhoondne ka asaan tareeqa:</strong> agar A se C jana hai to kisi bhi maloom raste se jao (AC = AO + OC). Agar ek vector doosre ka multiple ho (jaise PQ = 2 × PR) to wo parallel aur collinear hote hain.',
    urdu:'ویکٹر کی لمبائی فیثاغورث کے قانون √(x² + y²) سے معلوم کی جاتی ہے۔',
    eqs:[[`|<b>v</b>| = √(<i>x</i><sup>2</sup> + <i>y</i><sup>2</sup>)`,'Vector magnitude'],[`<b>AB</b> = <b>OB</b> − <b>OA</b>`,'Position vectors']],
    we:{q:'Given a = (3, −4), calculate |a| and 2a.',s:['|a| = √(3² + (−4)²) = √(9 + 16) = 5.','2a = (6, −8).'],a:'|a| = 5, 2a = (6, −8)'},
    tip:['Examiner tip','Always state BOTH facts when proving three points A, B, C are collinear: (1) AB = k·BC so they are parallel, AND (2) they share the common point B.'],
    fcs:[{tag:'Formula · 7.2',front:'Magnitude of column vector (x, y)',back:'√(x² + y²).'},{tag:'Rule · 7.2',front:'Proving two vectors are parallel',back:'Show one is a scalar multiple of the other (u = k·v).'}],
    mcqs:[{q:'Find the magnitude of vector (−5, 12).',o:['7','13','17','169'],a:1,e:'√((−5)² + 12²) = √(25 + 144) = √169 = 13.',obj:'7.2'}],
